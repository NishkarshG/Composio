const SCHEMA_TEXT = `{
 "slug": "lowercase-id", "name": "App name", "website": "https://...",
 "summary": "one sentence on what getting an OAuth app ready looks like",
 "difficulty": 1-5 (1 = minutes, self-serve; 5 = gated, weeks, human review),
 "difficultyWhy": "1-2 sentences",
 "time": {"setup": "...", "approval": "...", "total": "..."},
 "gatingModel": "self-serve | self-serve-with-limits | review-required | partner-or-tenant-gated",
 "devModeLimits": "what works before approval, or null",
 "stages": [{"name": "...", "duration": "...", "owner": "you|agent|provider"}],
 "steps": [{"n": 1, "title": "...", "detail": "concrete instructions with field names", "owner": "you|agent", "url": "official https URL you are confident exists, or null"}],
 "requirements": ["..."], "gotchas": ["..."],
 "blockers": [{"blocker": "...", "symptom": "...", "whatToDo": "...", "escalation": "..."}],
 "agentCanDo": ["..."], "youMustDo": ["login, 2FA, CAPTCHA, identity or business verification, payment, legal acceptance, ..."],
 "composio": {"redirectUri": "https://backend.composio.dev/api/v3/toolkits/auth/callback", "note": "provider-specific note"},
 "evidence": [{"claim": "specific factual claim made above", "status": "inferred|unverified", "source": "official URL or null", "note": "..."}],
 "uncertainties": ["things you could not confirm"]
}`;

function sampleCopy(code) {
  return ({
    no_runtime: "Live generation runs only when this page is open inside Claude (claude.ai or the Claude app). The library guides work anywhere.",
    not_granted: "Claude access was declined for this page, so live generation is switched off. Reload and allow it to try again.",
    sampling_disabled: "Claude is not available for this account.",
    rate_limited: "Too many requests or a usage limit was reached. Wait a few minutes and try again.",
    session_expired: "Your session expired. Sign in again and retry.",
    invalid_json: "The model's reply could not be read as a guide. Try again, or try a more specific name.",
    refused: "The model declined this request. Try a different app name.",
    prompt_too_large: "The request grew too large. Try again.",
    tools_unavailable: "This viewer cannot run the page tools the agent uses. Open the page in the Claude app or on claude.ai.",
  })[code] || "The generation service failed. You can try again.";
}

function showProgress(name, steps, note) {
  const row = (s) => `<li class="${s.state}"><span class="st">${{ run: "running", done: "done", fail: "failed", wait: "waiting" }[s.state]}</span><span>${esc(s.label)}${s.state === "run" ? '<span class="dots"></span>' : ""}${s.detail ? ` <span class="muted">${esc(s.detail)}</span>` : ""}</span></li>`;
  $("#main").innerHTML = `<section class="panel gen" aria-live="polite"><h2>Generating a guide for ${esc(name)}</h2><ol>${steps.map(row).join("")}</ol>${note ? `<p class="muted" style="font-size:13px">${esc(note)}</p>` : ""}<div><button class="btn ghost small" type="button" id="stop">Stop</button></div></section>`;
  $("#stop").onclick = () => busy && busy.abort();
}

async function generate(rawName) {
  if (busy) return;
  const name = rawName.trim();
  const ds = directoryStatus(name);
  const steps = [
    { label: "Check the Composio OAuth directory", state: "done", detail: ds.status === "managed" ? "Composio provides a managed app" : ds.status === "byo" ? "You register your own app" : "Not listed as an OAuth toolkit" },
    { label: "Agent drafts the guide", state: "run", detail: "" },
    { label: "Second pass reviews the draft for likely errors", state: "wait", detail: "" },
  ];
  current = null; generated = null; renderRail();
  busy = new AbortController();
  showProgress(name, steps, "The first call asks you to allow Claude on this page. A draft takes about one to three minutes.");
  window.scrollTo({ top: 0 });
  try {
    sampleP = sampleP || (window.claude && window.claude.use ? window.claude.use("sample") : Promise.resolve(null));
    const sample = await sampleP;
    if (!sample) throw { code: "no_runtime" };
    const tools = [
      { name: "checkComposioDirectory", description: "Look up an app name in Composio's directory of OAuth toolkits. Returns whether Composio supplies a managed OAuth app (managed) or the developer must register their own (bring_your_own), plus close matches.",
        inputSchema: { type: "object", properties: { name: { type: "string" } }, required: ["name"] },
        execute: (inp) => { const q = str(inp.name); const r = directoryStatus(q); steps[1].detail = `checked directory for ${q}`; showProgress(name, steps); return { query: q, match: r.slug ? { slug: r.slug, status: r.status === "byo" ? "bring_your_own" : "managed" } : null, similar: similar(q, 5).map((x) => ({ slug: x.s, status: x.status === "byo" ? "bring_your_own" : "managed" })) }; } },
      { name: "getReferenceGuide", description: "Return one finished, source-checked guide from the library to use as a format and quality reference. Valid slugs: " + GUIDES.map((g) => g.slug).join(", ") + ". Call it once.",
        inputSchema: { type: "object", properties: { slug: { type: "string" } }, required: ["slug"] },
        execute: (inp) => { const g = GUIDES.find((x) => x.slug === str(inp.slug)); if (!g) throw new Error("unknown slug"); steps[1].detail = `reading the ${g.name} reference`; showProgress(name, steps); const { evidence, ...rest } = g; return { ...rest, evidence: evidence.slice(0, 3) }; } },
    ];
    const draftPrompt = `You are an integration researcher. A developer building an AI agent wants their users to connect "${name}" through Composio, an agent integration platform. Work out what it takes to get a provider OAuth app ready and approved for ${name}, and write a guide.

What you know about the situation: the Composio directory says ${ds.status === "managed" ? `Composio already provides a managed OAuth app for ${name}, so registering your own is optional (needed for your own branding, custom scopes or separate rate limits)` : ds.status === "byo" ? `the developer must register their own OAuth app for ${name}` : `${name} is not listed as an OAuth toolkit; it may use API keys instead, or may not be integrated yet. Say which, if you know`}. Call checkComposioDirectory once to confirm, and getReferenceGuide once (pick the library app closest to ${name} in how access is gated) so your output matches the library's format and level of detail.

Hard rules:
- You cannot browse the web in this environment. Everything you write comes from memory and may be out of date. Never claim you checked a page.
- Every item in "evidence" must have status "inferred" or "unverified". Use "unverified" for any price, quota, user cap, date, review time or threshold.
- Give a URL only if you are confident it is a real official page; otherwise use null. Never invent URLs.
- Be concrete about who must act (you, the agent, the provider or a customer admin), and about anything an agent cannot do: login, two-factor, CAPTCHA, identity or business verification, payment, legal acceptance.
- Use "https://backend.composio.dev/api/v3/toolkits/auth/callback" as composio.redirectUri.
- 6 to 10 steps, 3 to 6 stages, 3 to 5 blockers, 8 to 14 evidence items.

Reply with only one JSON object in exactly this shape:
${SCHEMA_TEXT}`;
    const draft = await sample.json(draftPrompt, { tools, signal: busy.signal });
    steps[1].state = "done"; steps[1].detail = ""; steps[2].state = "run";
    showProgress(name, steps);

    const reviewPrompt = `You are a sceptical reviewer. Below is a draft guide written from memory, without web access, about getting an OAuth app approved for "${name}". Find the claims most likely to be wrong or out of date: prices, quotas, user caps, review durations, thresholds, dates, console names, scope names, policy changes. For each, soften the wording, move it to the "uncertainties" list, or remove it. Add any important blocker or requirement the draft missed. Keep the same JSON shape and keep it complete. Every evidence item must stay "inferred" or "unverified", and any URL you are not sure exists must become null. Begin the "uncertainties" list with 2 to 4 short notes on what the review changed or doubts.

Reply with only the corrected JSON object.

Draft:
${JSON.stringify(draft)}`;
    let final = draft, reviewed = true;
    try { final = await sample.json(reviewPrompt, { signal: busy.signal }); }
    catch (e) { if (e && e.code === "cancelled") throw e; final = draft; reviewed = false; }
    steps[2].state = reviewed ? "done" : "fail"; steps[2].detail = reviewed ? "" : "skipped, showing the first draft";

    const g = normalizeGuide(final, name, ds, reviewed);
    generated = g; renderRail(); renderGuide(g, true);
  } catch (e) {
    if (e && e.code === "cancelled") { renderOverview(); }
    else {
      try { console.error("generate failed", e && e.code ? e.code : e, e && e.message ? e.message : ""); } catch (_) {}
      const code = e && e.code ? e.code : "upstream_error";
      steps.forEach((s) => { if (s.state === "run") { s.state = "fail"; } });
      showProgress(name, steps);
      $("#main").querySelector(".gen").insertAdjacentHTML("beforeend", `<div class="banner"><b>Could not finish.</b><span>${esc(sampleCopy(code))}</span></div>`);
      const stop = $("#stop"); stop.textContent = "Back to overview"; stop.onclick = renderOverview;
    }
  } finally { busy = null; }
}

function normalizeGuide(raw, name, ds, reviewed) {
  const g = raw && typeof raw === "object" && !Array.isArray(raw) ? raw : {};
  const d = Math.min(5, Math.max(1, Math.round(Number(g.difficulty)) || 3));
  const time = g.time && typeof g.time === "object" ? g.time : {};
  const owner = (o, allowed) => (allowed.includes(o) ? o : "you");
  const cleanText = (a) => arr(a).map((x) => str(x)).filter(Boolean);
  const out = {
    slug: "generated", name: str(g.name, name) || name, composioSlug: ds.slug || "", website: safeUrl(g.website) || "",
    summary: str(g.summary, "Draft guide generated from model knowledge."), difficulty: d, difficultyWhy: str(g.difficultyWhy, ""),
    time: { setup: str(time.setup, "Unknown"), approval: str(time.approval, "Unknown"), total: str(time.total, "Unknown") },
    gatingModel: Object.keys(GATING).includes(g.gatingModel) ? g.gatingModel : "review-required",
    devModeLimits: g.devModeLimits ? str(g.devModeLimits) : null,
    stages: arr(g.stages).map((s) => ({ name: str(s && s.name), duration: str(s && s.duration), owner: owner(s && s.owner, ["you", "agent", "provider"]) })).filter((s) => s.name),
    steps: arr(g.steps).map((s, i) => ({ n: i + 1, title: str(s && s.title), detail: str(s && s.detail), owner: owner(s && s.owner, ["you", "agent"]), url: safeUrl(s && s.url) })).filter((s) => s.title),
    requirements: cleanText(g.requirements), gotchas: cleanText(g.gotchas),
    blockers: arr(g.blockers).map((b) => ({ blocker: str(b && b.blocker), symptom: str(b && b.symptom), whatToDo: str(b && b.whatToDo), escalation: str(b && b.escalation) || null })).filter((b) => b.blocker),
    agentCanDo: cleanText(g.agentCanDo), youMustDo: cleanText(g.youMustDo),
    composio: { redirectUri: "https://backend.composio.dev/api/v3/toolkits/auth/callback", note: str(g.composio && g.composio.note) },
    // No page was opened while generating, so nothing the model says can be "verified".
    evidence: arr(g.evidence).map((e) => ({ claim: str(e && e.claim), status: e && e.status === "inferred" ? "inferred" : "unverified", source: safeUrl(e && e.source), note: str(e && e.note) || null })).filter((e) => e.claim),
    uncertainties: cleanText(g.uncertainties), directory: ds,
  };
  if (ds.status !== "none") out.evidence.unshift({ claim: ds.status === "managed" ? `Composio provides a managed OAuth app for ${out.name}.` : `Composio has no managed OAuth app for ${out.name}: you register your own and supply it through a custom auth config.`, status: "verified", source: "https://docs.composio.dev/toolkits/managed-auth", note: "From the directory captured " + DIRECTORY.capturedOn + ", matched by this page, not by the model." });
  if (!reviewed) out.uncertainties.unshift("The second review pass did not complete, so this is the first draft.");
  return out;
}

$("#q").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); submitQuery(); } if (e.key === "Escape") $("#sugg").hidden = true; });
$("#go").addEventListener("click", submitQuery);
$("#sugg").addEventListener("click", (e) => { const b = e.target.closest("button[data-i]"); if (b) pick($("#sugg")._items[Number(b.dataset.i)]); });
window.addEventListener("hashchange", () => { const t = location.hash.slice(1); if (!busy && t && GUIDES.some((g) => g.slug === t) && t !== current) openGuide(t); });

(function boot() {
  const t = location.hash.slice(1);
  if (t && GUIDES.some((g) => g.slug === t)) openGuide(t); else renderOverview();
  try { sampleP = window.claude && window.claude.use ? window.claude.use("sample") : null; } catch (_) { sampleP = null; }
})();
</script>
