<title>Approval Path</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one working surface. A narrow rail lists the library; the main pane shows the overview ladder or one guide laid out as a path (stages, owners, evidence). */
:root {
  --bg: #edf0f3;
  --surface: #ffffff;
  --surface-2: #f5f7f9;
  --fg: #131c26;
  --muted: #536270;
  --line: #d3dae1;
  --accent: #0a5f7a;
  --accent-ink: #ffffff;
  --accent-soft: #dbedf3;
  --ok: #1d7545;
  --ok-bg: #dff1e6;
  --warn: #8f5a00;
  --warn-bg: #fbeccb;
  --bad: #ad2f1d;
  --bad-bg: #f9dfda;
  --f-display: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c131a; --surface: #131c25; --surface-2: #19242f; --fg: #e4ebf1; --muted: #92a2b1; --line: #27353f;
    --accent: #63c4e0; --accent-ink: #06222b; --accent-soft: #11313c;
    --ok: #6fd09a; --ok-bg: #12301f; --warn: #f0b95a; --warn-bg: #352708; --bad: #f09484; --bad-bg: #38170f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c131a; --surface: #131c25; --surface-2: #19242f; --fg: #e4ebf1; --muted: #92a2b1; --line: #27353f;
  --accent: #63c4e0; --accent-ink: #06222b; --accent-soft: #11313c;
  --ok: #6fd09a; --ok-bg: #12301f; --warn: #f0b95a; --warn-bg: #352708; --bad: #f09484; --bad-bg: #38170f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 56px;
}
a { color: var(--accent); text-underline-offset: 2px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 20px; }
.mono { font-family: var(--f-mono); font-size: 0.86em; }
.muted { color: var(--muted); }

/* masthead */
.mast { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 24px; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 22px; letter-spacing: -0.02em; text-decoration: none; color: var(--fg); background: none; border: 0; padding: 0; }
.brand span { color: var(--accent); }
.tag { color: var(--muted); font-size: 13.5px; max-width: 62ch; }

/* lookup */
.lookup { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; position: relative; }
.lookup label { font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.lookup-row { display: flex; gap: 10px; flex-wrap: wrap; }
.lookup input { flex: 1 1 260px; min-width: 0; font: inherit; padding: 11px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); color: var(--fg); }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 600; padding: 10px 16px; border-radius: 8px; }
.btn:hover { filter: brightness(1.08); }
.btn[disabled] { opacity: 0.55; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.small { padding: 6px 11px; font-size: 13px; }
.sugg { list-style: none; margin: 0; padding: 0; display: grid; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.sugg[hidden] { display: none; }
.sugg li { margin: 0; }
.sugg button { width: 100%; text-align: left; display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 9px 12px; background: var(--surface); border: 0; border-bottom: 1px solid var(--line); }
.sugg li:last-child button { border-bottom: 0; }
.sugg button:hover, .sugg button:focus-visible { background: var(--accent-soft); }
.sugg .nm { font-weight: 500; }
.sugg .act { font-size: 12.5px; color: var(--accent); white-space: nowrap; }

/* chips */
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; letter-spacing: 0.02em; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip.ok { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.chip.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.chip.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.chip.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

/* two-pane */
.shell { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 20px; align-items: start; }
.rail { display: grid; gap: 6px; position: sticky; top: 12px; }
.rail h2 { font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-family: var(--f-body); font-weight: 600; margin-bottom: 4px; }
.rail button { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; display: grid; gap: 5px; }
.rail button:hover { border-color: var(--accent); }
.rail button[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); }
.rail .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.rail .nm { font-weight: 600; }
.main { min-width: 0; display: grid; gap: 18px; }

/* meter */
.meter { display: inline-flex; gap: 3px; vertical-align: middle; }
.meter i { width: 14px; height: 7px; border-radius: 2px; background: var(--line); display: block; }
.meter.l-ok i.on { background: var(--ok); }
.meter.l-warn i.on { background: var(--warn); }
.meter.l-bad i.on { background: var(--bad); }
.meter.lg i { width: 26px; height: 9px; }

/* overview */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 14px; min-width: 0; overflow-wrap: anywhere; }
.panel .tbl-wrap { overflow-wrap: normal; }
.panel h2 { font-size: 20px; }
.panel h3 { font-size: 15.5px; }
.lede { max-width: 68ch; }
.stat-row { display: flex; flex-wrap: wrap; gap: 10px 28px; }
.stat b { font-family: var(--f-display); font-size: 30px; line-height: 1; display: block; letter-spacing: -0.02em; }
.stat span { font-size: 12.5px; color: var(--muted); }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td .lnk { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; text-align: left; text-decoration: underline; text-underline-offset: 2px; }
.learn { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.learn div { border-top: 2px solid var(--accent); padding-top: 8px; display: grid; gap: 4px; font-size: 14px; }
.learn b { font-family: var(--f-display); font-size: 15px; }

/* guide */
.ghead { display: grid; gap: 10px; }
.ghead h2 { font-size: 30px; line-height: 1.1; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.metric { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.metric .k { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.metric .v { font-weight: 500; overflow-wrap: anywhere; }
.metric .v.big { font-family: var(--f-display); font-size: 19px; font-weight: 600; }
.banner { border: 1px solid var(--warn); background: var(--warn-bg); color: var(--fg); border-radius: 8px; padding: 10px 12px; font-size: 14px; display: grid; gap: 3px; }
.banner b { color: var(--warn); }
.callout { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 10px 12px; border-radius: 0 8px 8px 0; display: grid; gap: 2px; }
.callout b { font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); }
.path { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(170px, 1fr); gap: 0; overflow-x: auto; padding-bottom: 4px; }
.stage { padding: 0 14px 0 0; display: grid; gap: 5px; align-content: start; position: relative; min-width: 0; }
.stage::before { content: ""; position: absolute; left: 0; right: 0; top: 7px; height: 2px; background: var(--line); }
.stage::after { content: ""; position: relative; display: block; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); border: 3px solid var(--surface); box-shadow: 0 0 0 1.5px var(--accent); order: -1; margin-left: 0; z-index: 1; }
.stage.provider::after { background: var(--surface); box-shadow: 0 0 0 1.5px var(--warn); }
.stage.agent::after { background: var(--ok); box-shadow: 0 0 0 1.5px var(--ok); }
.stage .nm { font-weight: 500; font-size: 14px; margin-top: 4px; overflow-wrap: anywhere; }
.stage .du { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.split { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
.split > div { display: grid; gap: 8px; align-content: start; min-width: 0; }
ul.plain { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
ol.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; counter-reset: s; }
ol.steps li { counter-increment: s; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; }
ol.steps li::before { content: counter(s); font-family: var(--f-mono); font-size: 13px; width: 28px; height: 28px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 500; }
ol.steps .t { font-weight: 600; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
ol.steps .d { color: var(--fg); margin-top: 2px; overflow-wrap: anywhere; }
ol.steps .u { font-size: 13px; margin-top: 3px; overflow-wrap: anywhere; }
details.blk { border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }
details.blk summary { padding: 10px 12px; cursor: pointer; font-weight: 600; }
details.blk .in { padding: 0 12px 12px; display: grid; gap: 6px; font-size: 14px; }
.ev-bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--line); }
.ev-bar i { display: block; height: 100%; }
.ev-bar .v { background: var(--ok); } .ev-bar .i { background: var(--warn); } .ev-bar .u { background: var(--bad); }
.ev-key { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }
.ev-list { display: grid; gap: 8px; }
.ev { border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; display: grid; gap: 4px; font-size: 14px; background: var(--surface-2); }
.ev .src { font-size: 12.5px; overflow-wrap: anywhere; }
.ev .nt { font-size: 13px; color: var(--muted); }
.foot { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }

/* generation progress */
.gen { display: grid; gap: 8px; }
.gen ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.gen li { display: flex; gap: 10px; align-items: baseline; font-size: 14px; }
.gen .st { font-family: var(--f-mono); font-size: 12px; min-width: 62px; color: var(--muted); }
.gen li.run .st { color: var(--accent); }
.gen li.done .st { color: var(--ok); }
.gen li.fail .st { color: var(--bad); }
.dots::after { content: ""; animation: dots 1.2s steps(4, end) infinite; }
@keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
@media (prefers-reduced-motion: reduce) { .dots::after { animation: none; content: "..."; } }

@media (max-width: 820px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; grid-auto-flow: column; grid-auto-columns: minmax(190px, 1fr); overflow-x: auto; padding-bottom: 4px; }
  .rail h2 { display: none; }
  .ghead h2 { font-size: 26px; }
  .path { grid-auto-flow: row; grid-auto-columns: auto; }
  .stage { padding: 0 0 14px 24px; }
  .stage::before { left: 6px; right: auto; top: 0; bottom: 0; width: 2px; height: auto; }
  .stage::after { position: absolute; left: 0; top: 2px; }
  .stage .nm { margin-top: 0; }
}
</style>

<div class="wrap">
  <header class="mast">
    <button class="brand" id="home" type="button" aria-label="Approval Path, back to overview">Approval <span>Path</span></button>
    <p class="tag">How long it takes, what blocks you and who has to act when you register a provider OAuth app for an agent integration.</p>
  </header>

  <section class="lookup" aria-labelledby="lk-l">
    <label id="lk-l" for="q">Look up an app</label>
    <div class="lookup-row">
      <input id="q" type="text" autocomplete="off" spellcheck="false" placeholder="Name or website, e.g. Spotify, Pipedrive, docusign.com" aria-controls="sugg">
      <button class="btn" id="go" type="button">Find guide</button>
    </div>
    <ul class="sugg" id="sugg" hidden></ul>
  </section>

  <div class="shell">
    <nav class="rail" id="rail" aria-label="Guide library"></nav>
    <main class="main" id="main"></main>
  </div>
</div>

<script>
const GUIDES = [{"slug":"metaads","name":"Meta Ads (Facebook Marketing API)","composioSlug":"METAADS","website":"https://developers.facebook.com/docs/marketing-api/","summary":"Register a Meta developer account and app (with a business portfolio), add the Marketing API use case, then pass Business Verification and App Review for Advanced Access to ads_read/ads_management (and business_management) before any user outside your own team can connect ad accounts.","difficulty":4,"difficultyWhy":"App creation is self-serve, but connecting other businesses' ad accounts requires Business Verification (admin of a real business, legal documents) plus per-permission App Review with a screencast and working test credentials, and community reports in 2026 describe review taking weeks with rejections for vague notes or broken test access.","time":{"setup":"~30-60 min (developer account, business portfolio, app, Marketing API use case, redirect URI)","approval":"Business Verification: no official timeline (community reports range from under 1 day to about a week or more); App Review: ~1-3 weeks recently (reported, not official)","total":"~2-5 weeks typical if submitted cleanly; longer after rejections"},"gatingModel":"review-required","devModeLimits":"New apps start in Development mode. Only people with a role on the app (Admin/Developer/Tester) can grant permissions and use features; the app is hidden from the public. Marketing API default tier is 'Limited' (development only): heavily limited rate limits per ad account (Development tier score max 60; ads_management BUC 300 + 40 x active ads per hour), limited Business Manager API access, 1 system user + 1 admin system user. Apps managing only their own ad accounts can use ads_read/ads_management at Standard Access without review. Calls on any level hit production data.","stages":[{"name":"Meta developer account + business portfolio","duration":"15-30 min","owner":"you"},{"name":"Create app and add Marketing API use case; configure Facebook Login redirect URI","duration":"15-30 min","owner":"you"},{"name":"Develop and test as role users in Development mode (generate real API calls)","duration":"days (depends on build)","owner":"agent"},{"name":"Business Verification (documents uploaded in Business Manager, admin only)","duration":"~1 day to 1+ weeks (reported)","owner":"provider"},{"name":"Prepare App Review submission: screencast, step-by-step notes, test credentials","duration":"0.5-1 day","owner":"you"},{"name":"App Review for Advanced Access (per permission) and Marketing API tier upgrade","duration":"~1-3 weeks (reported); Meta reportedly warns ~20 days","owner":"provider"},{"name":"Switch app to Live mode and create Composio custom auth config","duration":"10-15 min","owner":"you"}],"steps":[{"n":1,"title":"Register as a Meta developer","detail":"Log in to developers.facebook.com with a personal Facebook account and complete developer registration. You must be registered and logged in before you can create an app. Use an account that will remain with the company; you can hold a role on at most 15 apps not connected to a Meta Verified Business.","owner":"you","url":"https://developers.facebook.com/docs/development/create-an-app"},{"n":2,"title":"Create or choose a business portfolio (Business Manager)","detail":"Create a business portfolio at business.facebook.com under your real legal business name (it must later match your verification documents exactly, per a community report). A portfolio connected to the app is required if the app accesses data you do not own or manage. Make sure an Admin of the portfolio is available for verification.","owner":"you","url":"https://developers.facebook.com/docs/development/release/business-verification"},{"n":3,"title":"Create the app and select the Marketing API use case","detail":"Go to https://developers.facebook.com/apps/creation/ . Enter app name and contact email, select use case(s) (look for the ads/Marketing API use case; if not listed choose Other and follow the Other App Types guide), connect your business portfolio (verified, unverified or none for now), review requirements, then 'Go to dashboard'. Selecting a use case auto-adds its required permissions/products; use cases cannot be removed once added. Exact label of the Marketing API use case was not confirmed on the docs page.","owner":"you","url":"https://developers.facebook.com/apps/creation/"},{"n":4,"title":"Configure Facebook Login (or Facebook Login for Business) and the redirect URI","detail":"In App Dashboard > Facebook Login > Settings add https://backend.composio.dev/api/v3/toolkits/auth/callback to Valid OAuth Redirect URIs. Strict Mode requires an exact full-URI match; HTTPS is enforced; Client OAuth Login and Web OAuth Login should be on for a server-side web flow. Copy App ID (client ID) and App Secret (Settings > Basic). If your app uses Facebook Login for Business, create a Configuration (access token type, assets, permissions) and note that config_id replaces scope; whether Composio's flow can send config_id is not known, so prefer classic scope-based flow for the Composio auth config unless Composio docs say otherwise.","owner":"you","url":"https://developers.facebook.com/docs/facebook-login/security/"},{"n":5,"title":"Test in Development mode with role users","detail":"Add teammates as Admin/Developer/Tester. Request scopes ads_read, ads_management (and business_management if you need Business Manager APIs) and make real Marketing API calls (reads and writes) against an ad account you or your testers can access. You need successful API calls for the access-tier upgrade and, per community comment, a test call before the 'Request advanced access' button activates. Keep at least 500 successful Marketing API calls in 15 days with <15% errors in the last 500 to hold Full access.","owner":"agent","url":"https://developers.facebook.com/docs/marketing-api/overview/authorization"},{"n":6,"title":"Complete Business Verification","detail":"Connect the app to your verified-to-be business in App Dashboard > Settings > Basic > Verification, then complete verification in Business Manager (Security Center). Only an Admin of the business can do it. Prepare legal registration documents, tax certificate or utility bill, matching legal name/address/phone/website. Required for Advanced Access (as of Feb 1, 2023) when other businesses will grant your app permissions; without it, users from other businesses cannot grant permissions.","owner":"you","url":"https://developers.facebook.com/docs/development/release/business-verification"},{"n":7,"title":"Request Advanced Access per permission (App Review)","detail":"App Dashboard > App Review > Permissions and Features: click 'Request advanced access' for ads_read and ads_management (and business_management, plus dependencies pages_read_engagement and pages_show_list for ads_management and business_management). For each, provide a business-terms justification (why you need to manage/read ads or business assets on behalf of other businesses), a screencast showing the login flow and ad data (impressions, spend, clicks, reach, conversions) inside your app, step-by-step reviewer instructions, and working test credentials. Only request permissions you demonstrably use today. Complete any other processes listed (e.g. data handling questions, privacy policy URL).","owner":"you","url":"https://developers.facebook.com/documentation/development/permissions"},{"n":8,"title":"Upgrade the Marketing API Access Tier to Full access","detail":"In App Dashboard click +Upgrade for the Marketing API access tier (previously 'Ads Management Standard Access'; Full access threshold is 500 Marketing API calls in 15 days). Check status in App Review > Permissions and Features. Full tier raises rate limits (score max 9000; ads_management BUC 100000 + 40 x active ads per hour), allows 10 system users + 1 admin system user and full Business Manager API access.","owner":"you","url":"https://developers.facebook.com/docs/marketing-api/overview/authorization"},{"n":9,"title":"Switch app to Live mode","detail":"Only after development and App Review are complete, an Admin flips the app-mode toggle in the App Dashboard toolbar to Live. In Live mode permissions can be requested from anyone but only App Review-approved ones work. Complete any basic settings the dashboard asks for (privacy policy URL, app icon, category); these exact requirements were not confirmed on the fetched page.","owner":"you","url":"https://developers.facebook.com/docs/development/build-and-test/app-modes"},{"n":10,"title":"Create the Composio custom auth config for METAADS","detail":"In Composio, create a custom auth config for METAADS with the App ID as client ID, App Secret as client secret, and scopes such as ads_read, ads_management, business_management (confirm the scopes the toolkit needs in Composio's toolkit docs). Redirect URI must match step 4 exactly. Composio will receive a user access token (short-lived, exchangeable to ~60-day long-lived); refresh behavior depends on Composio's implementation.","owner":"you","url":null}],"requirements":["Personal Facebook account to register as a Meta developer (must stay logged in/with 2FA ready).","A Meta business portfolio (Business Manager) connected to the app; an Admin of that business must complete Business Verification.","Business Verification documents (legal registration, tax or utility document, matching legal name/address/phone/website); exact document list lives in Meta Business Help Center, not the developer docs.","For managing other businesses' ad accounts: Advanced Access to ads_read and/or ads_management via App Review, plus Marketing API access tier Full access.","A publicly reachable app/website where reviewers can log in with test credentials, a privacy policy URL, and a screencast.","Active ad account(s) to test against (users need an ad account to connect).","Annual Data Use Checkup once the app is live with a use case or advanced access.","No fees to register or review (not explicitly confirmed on a fetched page)."],"gotchas":["Terminology changed: 'Ads Management Standard Access' is now the Marketing API Access Tier; its 'Standard Access' became 'Limited Access' and 'Advanced Access' became 'Full Access'. This is separate from the platform-wide Standard/Advanced Access ladder per permission. You need both.","Limited tier is 'for development only' and rate limits are very tight (Development tier score max 60, blocked 300 s at max), so a production agent on Limited will throttle quickly.","Business Verification gates Advanced Access: without it users from other businesses cannot grant your app permissions.","Strict Mode redirect URI: exact full-URI match including any parameters; HTTPS required. The Composio callback must be entered verbatim. The authorization doc recommends a trailing '/' on redirect_uri in the OAuth dialog, but the login security doc does not mention trailing slashes; verify the exact string Composio sends matches your list entry.","Facebook Login for Business uses config_id instead of scope; BISUT configs say scope should not be used. A config_id based flow may not be compatible with a generic OAuth client such as Composio's; classic Facebook Login with scope is the safer assumption. Apps created as FLB apps cannot switch back to classic login.","Standard Access is automatic for Business apps, but 'some API calls may not be available' at Standard Access.","Long-lived user tokens last about 60 days and cannot be exchanged once expired; users must re-authorize. Long-lived Page tokens have no fixed expiry. Business integration system user tokens (FLB, Tech Providers only) default to never expiring but require config_id flow.","ads_management and business_management list pages_read_engagement and pages_show_list as dependencies, which you must also request/justify.","Maintaining Advanced Access/Full tier requires continued usage: at least 500 successful Marketing API calls in 15 days with error rate under 15% over the last 500 calls.","Review reports (community, not official) cite rejections for: asking for permissions not yet used, vague notes, screencasts that skip functionality, test accounts blocked by 2FA/email verification/empty workspace/broken staging server, and legal name mismatch with Business Manager.","Meta can reject the entire submission if it cannot access your app for testing.","Page creation is not allowed via API at any tier.","Annual Data Use Checkup is required for live apps with advanced access; consequence of missing it was not stated on the fetched page."],"blockers":[{"blocker":"Business Verification stuck or rejected","symptom":"Verification status stays 'in review' or fails; Advanced Access request is blocked or other businesses cannot grant permissions.","whatToDo":"Ensure legal business name, address, phone and website exactly match documents and the Business Manager name; use an Admin account; resubmit with clearer documents. Start verification before building.","escalation":"Meta Business Help Center / Business Support chat (availability varies); Meta developer community forum https://developers.facebook.com/community/"},{"blocker":"App Review rejected for ads_management / ads_read / business_management","symptom":"Rejection message citing inability to test, screencast not showing the permission in use, or insufficient use-case explanation.","whatToDo":"Provide test credentials with no 2FA/email wall and a pre-populated test ad account, a screencast starting at the login page showing the consent flow and ad metrics in-app, and per-permission step-by-step notes with timestamps. Request only permissions in use. Test the instructions in a private window on a different network.","escalation":"Meta Developer Support (Bug/Support tool in the developer dashboard) and https://developers.facebook.com/community/"},{"blocker":"Cannot get the 'Request advanced access' button to enable / permission shows inactive","symptom":"Button greyed out or scope shows as not active even after setup.","whatToDo":"Make at least one successful API call for the permission as a role user, wait up to ~24 h (community report), then retry; confirm the Marketing API product is added.","escalation":"Meta Developer Community forum"},{"blocker":"Rate limiting on Limited/Development tier","symptom":"Errors 17 (subcode 2446079), 613 (subcode 1487742) or 80000/80003/80004/80014 'too many calls from this ad-account'.","whatToDo":"Back off with retries, reduce calls, and upgrade to Full access via +Upgrade after App Review approval.","escalation":null},{"blocker":"Review queue slowdown in 2026","symptom":"Submission pending for 2-3+ weeks.","whatToDo":"Submit one clean, complete request; avoid resubmitting repeatedly; plan for ~20 days of buffer (community/vendor claim).","escalation":null}],"agentCanDo":["Draft the per-permission use-case justifications and step-by-step reviewer instructions.","Write a screencast script and checklist (login page, consent dialog, ad metrics shown in-app) and verify the app flow works.","Build and run the integration against a test ad account to generate the required Marketing API call volume and handle rate-limit/backoff.","Implement long-lived token exchange (fb_exchange_token) and error handling if not delegated to Composio.","Prepare the Composio custom auth config values (redirect URI, scopes) and verify the redirect URI string matches exactly.","Prepare a privacy policy and data-deletion page draft for the human to publish."],"youMustDo":["Register the Meta developer account and log in (including 2FA).","Create the business portfolio and, as its Admin, complete Business Verification (identity/legal documents).","Create the app in the dashboard and accept Meta Platform Terms and Developer Policies.","Record and submit the screencast and the App Review request; supply real test credentials.","Click +Upgrade for the Marketing API access tier and switch the app to Live mode.","Complete the annual Data Use Checkup.","Copy the App Secret and enter it in Composio; never share it with the agent beyond what is needed."],"composio":{"redirectUri":"https://backend.composio.dev/api/v3/toolkits/auth/callback","note":"Add this exact URI to Valid OAuth Redirect URIs in the Meta app (Strict Mode requires exact match, HTTPS). Composio has no managed Meta Ads app, so only your own app's role users can authorize until Business Verification, App Review and Live mode are done. Prefer scope-based classic Facebook Login; Facebook Login for Business needs config_id instead of scope, and compatibility with Composio's auth config was not confirmed. Scopes likely needed: ads_read, ads_management, business_management (toolkit's exact scope list not verified)."},"evidence":[{"claim":"Marketing API terminology changed: 'Ads Management Standard Access' is now the Marketing API Access Tier with Limited and Full access; the Full threshold is 500 calls in 15 days.","status":"verified","source":"https://developers.facebook.com/docs/marketing-api/overview/authorization","note":"Page was fetched via summarizing tool; date of the rename not stated."},{"claim":"Platform-wide Standard Access is automatic for Business apps; Advanced Access requires App Review per permission; maintaining it needs 500 successful calls in 15 days with <15% error rate over last 500.","status":"verified","source":"https://developers.facebook.com/docs/marketing-api/overview/authorization","note":null},{"claim":"Limited tier is 'for development only'; Limited gives 1 system user + 1 admin system user and limited Business Manager API; Full gives 10 system users + 1 admin and full Business Manager/Catalog API; upgrade via +Upgrade in App Dashboard.","status":"verified","source":"https://developers.facebook.com/docs/marketing-api/overview/authorization","note":null},{"claim":"Managing only your own ad accounts needs only standard access to ads_read/ads_management; managing other people's ad accounts needs advanced access.","status":"verified","source":"https://developers.facebook.com/docs/marketing-api/overview/authorization","note":null},{"claim":"ads_management/ads_read/business_management descriptions, dependencies (pages_read_engagement, pages_show_list for ads_management and business_management), and screencast must show login flow and ad performance data.","status":"verified","source":"https://developers.facebook.com/documentation/development/permissions","note":"Page does not explicitly state App Review/Advanced Access/Business Verification per permission; the cross-business requirement is inferred from the submission-prompt wording."},{"claim":"Business Verification is needed for apps requesting advanced access (as of Feb 1, 2023) or letting other businesses grant permissions; only a business Admin can complete it; app is linked at Settings > Basic > Verification; without it users from other Businesses cannot grant permissions.","status":"verified","source":"https://developers.facebook.com/docs/development/release/business-verification","note":"Page lists no documents, timelines, 2025-2026 changes or rejection handling."},{"claim":"Business Verification takes under 1 day for some and 10+ days for others; legal name must match Business Manager name.","status":"inferred","source":"https://medium.com/@bilal.105.ahmed/facebook-marketing-api-the-advanced-access-trap-that-nearly-killed-my-project-7227ea2ee2c2","note":"Community report (a Medium comment said <1 day; the Meta community thread title says 'in review 10 days' but its page content did not confirm duration). Name-match claim from https://bundle.social/blog/meta-app-review-20-days (vendor blog). Not official."},{"claim":"App Review: Meta tests the app; if Meta cannot access the app the entire submission is rejected; permission not testable is not approved. Apps used only by role users need no review.","status":"verified","source":"https://developers.facebook.com/docs/resp-plat-initiatives/individual-processes/app-review","note":"Page does not mention screencast, instructions, test credentials or timelines."},{"claim":"App Review timing has lengthened in 2026: 1-3 days until 2025, 4-6 days early 2026, 9-12 days April 2026, 17-19 days May 2026, Meta reportedly warns of ~20 days.","status":"inferred","source":"https://bundle.social/blog/meta-app-review-20-days","note":"Vendor blog (sells a social API); article says its table is not official Meta data. Could not find an official Meta statement of 20 days."},{"claim":"Advanced Access review took over a week for one developer; each permission is requested separately; request button activation may need a test API call and ~24 h wait.","status":"inferred","source":"https://medium.com/@bilal.105.ahmed/facebook-marketing-api-the-advanced-access-trap-that-nearly-killed-my-project-7227ea2ee2c2","note":"Single community post and comments; anecdotal."},{"claim":"Common rejection reasons: unused permissions requested, vague notes, screencast skipping functionality, test accounts failing or blocked by 2FA/email walls/geo restrictions.","status":"inferred","source":"https://bundle.social/blog/meta-app-review-20-days","note":"Vendor blog, not official Meta guidance."},{"claim":"New apps start in Development mode (only role users, hidden); Live mode accepts requests from anyone but only App Review-approved permissions; switch via toolbar toggle after finishing development and App Review.","status":"verified","source":"https://developers.facebook.com/docs/development/build-and-test/app-modes","note":"Page does not state privacy policy URL/category/data deletion requirements for going Live."},{"claim":"Create app flow: register as developer, https://developers.facebook.com/apps/creation/, name+email, use cases, business portfolio, requirements, dashboard; use cases auto-add products and cannot be removed; 15-app limit without Meta Verified Business.","status":"verified","source":"https://developers.facebook.com/docs/development/create-an-app","note":"Page does not name a 'Business' app type nor the Marketing API use case; the old 'Business app type' framing is not confirmed in the current flow."},{"claim":"Marketing API get-started requires an active ad account, a Meta developer account and an app; covers authorization and token renewal.","status":"verified","source":"https://developers.facebook.com/docs/marketing-api/get-started","note":"Does not describe the Marketing API use case, business portfolios or system users."},{"claim":"Facebook Login for Business: preferred for Tech Providers; configurations produce config_id which replaces scope; user tokens are short-lived; BISUT tokens default to never expire, use authorization code only and are Tech Provider only; apps created as FLB cannot switch back; classic Facebook Login does not support config_id.","status":"verified","source":"https://developers.facebook.com/documentation/facebook-login/facebook-login-for-business","note":"Whether FLB is mandatory for new business apps in 2026 was not stated on the page."},{"claim":"Long-lived user tokens last about 60 days; exchange via oauth/access_token with grant_type=fb_exchange_token from the server; expired tokens cannot be exchanged.","status":"verified","source":"https://developers.facebook.com/docs/facebook-login/guides/access-tokens/get-long-lived","note":"Page says short-lived tokens expire 'in hours' without a number; system user token details not on this page."},{"claim":"Rate limits: Development tier score max 60 (block 300 s) vs Full access 9000 (block 60 s); BUC per hour ads_management 300+40x active ads (dev) vs 100000+40x active ads (full); ads_insights 600+400x vs 190000+400x; 100 mutation QPS per app/ad account.","status":"verified","source":"https://developers.facebook.com/docs/marketing-api/overview/rate-limiting","note":null},{"claim":"Valid OAuth Redirect URIs: Strict Mode required for all apps, exact full-URI match, HTTPS enforced; Client OAuth Login and Web OAuth Login toggles.","status":"verified","source":"https://developers.facebook.com/docs/facebook-login/security/","note":"Page does not address trailing slashes."},{"claim":"Data Use Checkup is annual (since Jan 2024) for developers with live apps that have a use case or advanced access.","status":"verified","source":"https://developers.facebook.com/docs/development/maintaining-data-access/data-use-checkup","note":"Consequences and 2025-2026 changes not stated on page."},{"claim":"Composio redirect URI is https://backend.composio.dev/api/v3/toolkits/auth/callback.","status":"unverified","source":null,"note":"Taken from the task brief/schema; Composio docs not fetched in this session."},{"claim":"Composio METAADS toolkit needs scopes ads_read, ads_management, business_management.","status":"unverified","source":null,"note":"Assumed from typical Marketing API usage; Composio toolkit scope list not checked."}],"uncertainties":["No official timeline for Business Verification or App Review exists in the fetched docs; the 2026 slowdown (~17-20 days) comes from a vendor blog and anecdotes only.","Exact documents Meta accepts for Business Verification are in the Business Help Center (facebook.com/business/help), which was not fetched/readable this session.","The current name/location of the Marketing API use case in the app creation flow (and whether a 'Business' app type still exists) was not confirmed on the official docs page.","Whether Composio's custom auth flow can use Facebook Login for Business (config_id) or only classic scope-based login is unknown; whether Meta now forces FLB for new business apps in 2026 was not confirmed.","System user token specifics (creation, expiry, Marketing API-specific doc) were not found on fetched pages; the /marketing-api/overview/authorization/ trailing-slash URL failed to fetch.","Requirements to switch to Live mode (privacy policy URL, data deletion URL, category) and the consequence of missing a Data Use Checkup were not stated on fetched pages.","Specific App Review submission format (screencast length, instruction fields) beyond what is in the permissions reference was not found in official docs; the rest is community guidance.","Fees: no fees mentioned, but absence of fees was not explicitly confirmed."],"lastChecked":"2026-10-20"},{"slug":"shopify","name":"Shopify","composioSlug":"SHOPIFY","website":"https://shopify.dev","summary":"Create an app in the Shopify Dev Dashboard (Partner organization), choose a distribution method, and use the shop-specific authorization code grant; a single store or one Plus organization can be done self-serve via custom distribution, while connecting arbitrary merchants requires public distribution and a human App Store review (plus protected customer data approval if you touch customer fields).","difficulty":4,"difficultyWhy":"Getting credentials is self-serve in minutes, but an agent product serving unrelated merchants needs public distribution (App Store review of unreported, community-reported length of 2+ weeks, compliance webhooks, protected customer data review), because custom distribution is limited to one store or one Plus organization. If you only need your own store(s), it drops to about 2.","time":{"setup":"~20-30 min (Dev Dashboard app + redirect URL + scopes + version release)","approval":"custom distribution: none | public App Store: no official SLA; community reports of 2+ weeks, sometimes 3+ weeks, and Shopify has posted about 'longer review times' (reported, not confirmed)","total":"same day for custom distribution (one store / one Plus org) | roughly 3-6+ weeks for a public listing including build of compliance webhooks and resubmissions (estimate)"},"gatingModel":"review-required","devModeLimits":"Before approval you can install the app on development stores (and, via custom distribution, on one merchant store or multiple stores in one Plus organization) with no Shopify approval. Protected customer data: on development stores you can select the data and fields in the Partner Dashboard and use them without review; on non-development stores the API will not return protected customer data until approved (for public apps both levels require review). Public App Store listing is the only way to be installed by arbitrary unrelated merchants. Non-development-store access to read_all_orders needs approval; without it only the last 60 days of orders are accessible.","stages":[{"name":"Create Partner/Dev Dashboard organization and app","duration":"10-20 min","owner":"you"},{"name":"Configure redirect URL (Composio callback), scopes, app version","duration":"10 min","owner":"you"},{"name":"Select distribution method (irreversible)","duration":"2 min","owner":"you"},{"name":"Custom distribution: generate install link per store, merchant approves install","duration":"minutes per store","owner":"you"},{"name":"Public distribution: request protected customer data access, build compliance webhooks, create App Store listing, submit","duration":"days to weeks of work","owner":"you"},{"name":"Shopify App Store review (and data protection review if requested)","duration":"no official SLA; community reports 2+ weeks","owner":"provider"},{"name":"Paste client ID/secret into Composio custom auth config and test OAuth","duration":"10 min","owner":"agent"}],"steps":[{"n":1,"title":"Get a Shopify developer identity and Dev Dashboard access","detail":"Sign in to the Dev Dashboard / Partner program with a Partner account or a merchant account with appropriate permissions (the getting-started page says a Partner account is not strictly required to run shopify app init). A Partner organization is needed for the Distribution card and for App Store submission. You also need a development store to test (can be created with `shopify store create dev` or from the Partner Dashboard).","owner":"you","url":"https://shopify.dev/docs/apps/getting-started/create"},{"n":2,"title":"Create the app in the Dev Dashboard","detail":"Create a new app in the Dev Dashboard (or run `shopify app init`, which creates the app in the Dev Dashboard). Note: you can no longer create new legacy custom apps in a store's Shopify admin (stop date announced as January 1, 2026; existing ones keep working), so the Dev Dashboard is the path. Client ID and client secret are found under Apps > [your app] > Settings.","owner":"you","url":"https://shopify.dev/docs/apps/build/authentication-authorization/client-secrets"},{"n":3,"title":"Select the distribution method","detail":"On the app's Home page click 'Select distribution method' on the Distribution card. Choose Custom distribution (one store, or multiple stores in the same Plus organization; no Shopify approval; no Shopify billing API) or Public distribution (App Store; requires Shopify approval). You cannot change this after selecting. If you keep separate dev and production apps, select the method on the production app. Protected customer data requests also require a distribution method to be selected, even for development stores.","owner":"you","url":"https://shopify.dev/docs/apps/launch/distribution/select-distribution-method"},{"n":4,"title":"Set the allowed redirect URL to the Composio callback","detail":"Add https://backend.composio.dev/api/v3/toolkits/auth/callback to the app's allowed redirection URLs (`auth.redirect_urls` in shopify.app.toml, or the app version's redirect URL setting in the Dev Dashboard). Shopify requires the complete redirect_uri sent in the authorize request to be listed as an allowed redirection URL, and at least one redirect URL before the app can be made public. Exact URL-matching/wildcard/HTTP rules were not found on a fetched page. Set App URL as required (for a non-embedded app set embedded = false). Deploy the version (`shopify app deploy` or release a version in the Dev Dashboard).","owner":"you","url":"https://shopify.dev/docs/apps/build/cli-for-apps/app-configuration"},{"n":5,"title":"Declare scopes (and request approvals for gated ones)","detail":"Declare the Admin API scopes your agent needs (e.g. read_products, write_orders) in [access_scopes] scopes (comma-separated string). A write scope implies read for that resource, so request write only where needed. With managed installation (default) merchants are prompted for all scopes listed in the app version; use optional_scopes for scopes requested after install. use_legacy_install_flow = true instead passes scopes as a URL parameter in the OAuth flow (supported, not recommended). read_all_orders and other 'Shopify approval required' scopes must be approved first, otherwise declaring them errors. Whatever scopes you declare must also be configured on the Composio custom auth config.","owner":"you","url":"https://shopify.dev/docs/api/usage/access-scopes"},{"n":6,"title":"Request protected customer data access (only if needed)","detail":"If the app reads customer, order, address, email, phone or name data: Partner Dashboard > Apps > your app > API access requests > Protected customer data access > Request access; pick data (Level 1 = customer data excluding name/address/phone/email; Level 2 = includes those fields), give reasons, complete Data protection details, then submit for review. Level 1 requires: minimal data, merchant disclosure, stated purposes, consent/opt-out handling, privacy agreements, retention periods, encryption at rest and in transit. Level 2 adds: encrypted backups, separate test/prod data, data loss prevention, limited staff access, strong passwords, access logs, incident response policy. Shopify may also run a deeper data protection review. No published timeline.","owner":"you","url":"https://shopify.dev/docs/apps/launch/protected-customer-data"},{"n":7,"title":"Implement mandatory compliance webhooks (public/App Store apps)","detail":"Every App Store app must subscribe to customers/data_request, customers/redact and shop/redact, even if it stores no personal data. Declare them in shopify.app.toml under [[webhooks.subscriptions]] with compliance_topics and a uri. The endpoint must accept POST JSON and return 401 for invalid HMAC. Acknowledge with a 2xx; complete the action within 30 days. shop/redact arrives 48 hours after uninstall. Subscribe before submitting; missing endpoints lead to rejection. Note this means you need a Shopify-facing webhook receiver you control (Composio does not do this for you).","owner":"you","url":"https://shopify.dev/docs/apps/build/compliance/privacy-law-compliance"},{"n":8,"title":"Create App Store listing and submit for review (public distribution)","detail":"Test OAuth install on a dev store from the Dev Dashboard 'Install app' button: the App URL / redirect settings must send merchants to the OAuth grant screen and the app must obtain a token and re-install cleanly (apps that do not are not approved). All charges must use Shopify's billing system. Provide test credentials/instructions. Accept the Partner Program Agreement and Shopify API License and Terms of Use. Review covers production-ready apps only; incomplete apps are rejected. Resubmissions slow the process.","owner":"you","url":"https://shopify.dev/docs/apps/launch/app-store-review/pass-app-review"},{"n":9,"title":"Custom distribution alternative: generate an install link per store","detail":"In the Dev Dashboard Distribution card, enter the store's myshopify.com or admin.shopify.com domain, optionally untick 'Allow multi-store installs for one Plus organization' to restrict to one store, click Generate link and send it to the store owner, who approves the install. No Shopify review. Multi-store only within one Plus organization. Cannot use Shopify billing.","owner":"you","url":"https://shopify.dev/docs/apps/launch/distribution/select-distribution-method"},{"n":10,"title":"Configure Composio custom auth config","detail":"In Composio, create a custom auth config for toolkit SHOPIFY (OAuth2) with the app's client ID and client secret and the same scopes. The flow Composio runs is Shopify's authorization code grant: user is redirected to https://{shop}.myshopify.com/admin/oauth/authorize?client_id=...&scope=...&redirect_uri=https://backend.composio.dev/api/v3/toolkits/auth/callback&state=... and the code is exchanged at https://{shop}.myshopify.com/admin/oauth/access_token. Each end user must therefore supply their shop subdomain before the redirect (confirm how Composio's Shopify toolkit collects it).","owner":"agent","url":"https://shopify.dev/docs/apps/build/authentication-authorization/access-tokens/authorization-code-grant"}],"requirements":["A Shopify developer identity (Partner account or merchant account with app development permissions) and a Partner/Dev Dashboard organization; a development store for testing.","Public distribution: an App Store listing, Shopify approval, acceptance of Partner Program Agreement and Shopify API License and Terms of Use, Shopify billing for all app charges, and mandatory compliance webhooks.","Custom distribution: the merchant must be a single store, or stores in the same Shopify Plus organization for multi-store installs.","A publicly reachable HTTPS webhook endpoint with valid SSL (or EventBridge/Pub/Sub) for compliance webhooks if public.","Protected customer data access (Level 1/2) with data protection details if any customer fields are read from non-development stores.","Cost of Partner account / Dev Dashboard / dev stores not stated on fetched pages (understood to be free but not verified)."],"gotchas":["Shopify authorization is shop-specific: the authorize URL and token endpoint are on the merchant's own {shop}.myshopify.com host, so a generic provider-wide authorize URL does not exist. The platform must collect the shop subdomain per user before redirecting (inferred: Composio's Shopify toolkit needs a shop/subdomain input; unverified).","A shared third-party redirect URI works only if that exact URL is added to the app's allowed redirection URLs; Shopify docs say the complete redirect_uri must be an allowed redirect URL. The Composio callback must be registered on the app version, and the app version must be released.","Distribution method is irreversible once selected. Choose on the production app. Custom distribution cannot use Shopify billing and is limited to one store or one Plus organization; it is not a way to reach arbitrary merchants (inferred from docs wording).","Legacy custom apps created in a store's admin: no new ones since January 1, 2026 (community.shopify.dev announcement; shopify.dev says 'You can no longer create new custom apps in the Shopify admin'); existing ones continue to work. Admin-created apps cannot rotate credentials. Dev Dashboard apps replace them.","Client credentials grant (the usual replacement for a store-owner-pasted token) works only for apps and stores in the SAME Dev Dashboard organization; it cannot reach a client's or other merchant's store. It is not usable for connecting unrelated merchants. Tokens last 24 hours (expires_in 86399).","Token types: offline (default, persists until uninstall, non-expiring unless opted in), online (access_mode=per-user, expires within 24h, needs refresh/re-auth). Opt-in expiring offline tokens (`expiring=1`): access token 1 hour, refresh token 90 days, with the refresh token rotating. Public apps must use expiring offline tokens for GraphQL Admin API requests by January 1, 2027 and new public apps cannot already use non-expiring tokens; this does not apply to custom or merchant-created apps. Composio's token refresh handling for Shopify's rotating refresh tokens is not verified.","OAuth callback security: Shopify sends hmac, shop, host, timestamp and state; the receiver should validate the HMAC (SHA-256 with the client secret), nonce/state and that shop ends with myshopify.com. Check that all requested scopes were granted because the merchant/user can alter the scope parameter. Whether Composio validates the HMAC is not verified.","Protected customer data: for public apps both levels require review; the API does not return protected data on non-development stores until approved. Plan for apps that read orders/customers.","Rate limits: GraphQL Admin API is cost-based per app per store: 100 points/s Standard, 200 Advanced, 1000 Plus, 2000 Enterprise (Commerce Components); single query max cost 1000; REST Admin uses a request-based leaky bucket. Once a store has 500,000 variants, max 10,000 new variants/day on any API (not on Plus).","Embedded apps should use token exchange and Shopify managed installation; the authorization code grant page is scoped to non-embedded apps and legacy apps not using managed installation. A Composio-driven redirect flow is a non-embedded authorization code grant, but App Store review checks that opening the app URL redirects merchants to the OAuth grant screen."],"blockers":[{"blocker":"Cannot reach unrelated merchants with custom distribution","symptom":"Install link only works for one store, or stores in one Plus organization; other merchants cannot install.","whatToDo":"Select Public distribution at the time you create the production app (the choice is irreversible) and go through App Store review, or create one custom-distribution app per merchant (not scalable).","escalation":"https://community.shopify.dev"},{"blocker":"App Store review slow or rejected","symptom":"Submission sits for weeks; or rejection for missing compliance webhooks, OAuth redirect failure on install/re-install, billing outside Shopify, UI errors, or missing test credentials.","whatToDo":"Use Shopify's requirements checklist, subscribe to all three compliance webhooks and verify HMAC (401 on invalid) before submitting, make sure the App URL leads to the OAuth grant screen, provide test credentials, and avoid unnecessary resubmissions. Community posters report waits over two weeks and Shopify staff have pointed to a post about longer App Store review times.","escalation":"https://community.shopify.dev (App Store category); Partner Dashboard support"},{"blocker":"Protected customer data not approved","symptom":"API returns redacted/blank customer fields or errors on non-development stores; app review flags missing request.","whatToDo":"Request only the minimum data/fields with clear reasons in Partner Dashboard > API access requests, complete data protection details, implement Level 1/2 requirements, and handle redacted data gracefully.","escalation":"Partner Dashboard API access requests status email/notifications; https://community.shopify.dev"},{"blocker":"Redirect URI mismatch (Composio callback not allowed)","symptom":"Shopify shows an OAuth error that the redirect_uri is not whitelisted on the app.","whatToDo":"Add https://backend.composio.dev/api/v3/toolkits/auth/callback exactly to the allowed redirection URLs and release a new app version; confirm the Composio auth config uses the same client ID.","escalation":null},{"blocker":"Gated scope declared before approval","symptom":"app_access validation error on scopes when deploying the app version.","whatToDo":"Remove the scope until Shopify approves it (e.g. read_all_orders requested from the Partner Dashboard).","escalation":"https://community.shopify.dev"}],"agentCanDo":["Prepare and validate the shopify.app.toml (scopes, auth.redirect_urls, embedded=false, compliance webhook subscriptions) and the webhook endpoint code including HMAC verification returning 401.","Draft the protected customer data justification text, data protection details, privacy policy and App Store listing copy.","Run Shopify CLI steps the developer has already authenticated (e.g. shopify app deploy) when the developer is logged in on that machine.","Configure the Composio custom auth config with client ID/secret, scopes and redirect URI, and test an OAuth connect flow against a dev store.","Produce a pre-submission checklist against the App Store requirements, and monitor status emails the developer forwards."],"youMustDo":["Sign in / create the Partner or Dev Dashboard account, accept the Partner Program Agreement and Shopify API License and Terms of Use, and complete any identity checks Shopify asks for.","Select the distribution method (irreversible) and submit the app and App Store listing for review.","Submit the protected customer data request and data protection details, and respond to any data protection review.","Have each merchant (or you, for your own store) approve the app install on the OAuth grant screen / via the custom distribution install link.","Provide test credentials and instructions for reviewers; handle review feedback and resubmission.","Keep client secret safe and paste it into Composio; rotate it periodically."],"composio":{"redirectUri":"https://backend.composio.dev/api/v3/toolkits/auth/callback","note":"Add this exact URL to the Shopify app's allowed redirection URLs and release the app version. Shopify's authorize and token endpoints are per shop ({shop}.myshopify.com), so Composio must know the user's shop subdomain at connect time; a single static provider-level authorize URL will not work. Use the authorization code grant (non-embedded). Client credentials grant and token exchange (embedded) are not what Composio's redirect flow uses. Scopes on the Composio auth config must match those declared in the Shopify app version (managed installation prompts for the scopes in the deployed version). Consider whether expiring offline tokens will be requested: public apps must use them for GraphQL Admin API by 2027-01-01, which requires refresh handling (unverified in Composio)."},"evidence":[{"claim":"Authorization code grant uses an oauth/authorize link on the shop's domain with client_id, scope, redirect_uri, nonce/state, and access_mode=per-user for online tokens; HMAC is SHA-256 over sorted params using the client secret; callback must check nonce, hmac and shop ends with myshopify.com; scopes granted should be re-checked.","status":"verified","source":"https://shopify.dev/docs/apps/build/authentication-authorization/access-tokens/authorization-code-grant","note":"Page did not print the literal authorize URL template; the https://{shop}.myshopify.com/admin/oauth/authorize form is inferred from the shop-in-URL description and the token endpoint on the offline-token page."},{"claim":"The redirect_uri sent in the authorize request must be added to the app as an allowed redirection URL.","status":"verified","source":"https://shopify.dev/docs/apps/build/authentication-authorization/access-tokens/authorization-code-grant","note":"The page said Partner Dashboard; Dev Dashboard / app config auth.redirect_urls is the current equivalent per the app-configuration page."},{"claim":"Token endpoint for both token exchange and authorization code grant is POST https://{shop}.myshopify.com/admin/oauth/access_token.","status":"verified","source":"https://shopify.dev/docs/apps/build/authentication-authorization/access-tokens/offline-access-tokens","note":null},{"claim":"Offline tokens are non-expiring by default; opt-in expiring offline tokens via expiring=1 last 1 hour with a 90-day refresh token; public apps must use expiring offline tokens for GraphQL Admin API by January 1, 2027, and new public apps cannot use non-expiring; not required for custom or merchant-created apps. Online tokens last up to 24 hours.","status":"verified","source":"https://shopify.dev/docs/apps/build/authentication-authorization/access-tokens/offline-access-tokens","note":"Online token 24h detail from the authorization-code-grant page."},{"claim":"Public distribution requires Shopify approval and can be installed on multiple stores; custom distribution needs no approval, is for one store (or multiple stores in the same Plus organization, or dev stores), cannot use Shopify billing, and the choice cannot be changed.","status":"verified","source":"https://shopify.dev/docs/apps/launch/distribution","note":null},{"claim":"Distribution is selected in the Dev Dashboard Distribution card; custom distribution install link is generated by entering the store domain, optionally unticking multi-store Plus option; multi-store installs only within the same Plus org; custom apps created before July 26, 2023 need Support to enable multi-store.","status":"verified","source":"https://shopify.dev/docs/apps/launch/distribution/select-distribution-method","note":null},{"claim":"Legacy custom apps cannot be created anymore: community announcement says starting January 1, 2026 you cannot create new legacy custom apps, existing apps unaffected; shopify.dev says new custom apps cannot be created in the Shopify admin and should use Dev Dashboard or CLI.","status":"verified","source":"https://community.shopify.dev/t/starting-january-1-2026-you-will-not-be-able-to-create-new-legacy-custom-apps-this-will-not-impact-any-existing-apps/26798","note":"Date comes from a community-forum announcement thread (title and fetched summary); shopify.dev pages (distribution and generate-app-access-tokens-admin) state the restriction without a date. Cross-checked shopify.dev/docs/apps/build/authentication-authorization/access-tokens/generate-app-access-tokens-admin."},{"claim":"Client credentials grant works only for apps and stores in the same Dev Dashboard organization, returns 24-hour tokens (expires_in 86399), and cannot be used for other merchants' stores; for other merchants use custom distribution with authorization code grant or token exchange.","status":"verified","source":"https://shopify.dev/docs/apps/build/authentication-authorization/access-tokens/client-credentials-grant","note":null},{"claim":"Client ID/secret are under Apps > [app] > Settings in the Dev Dashboard.","status":"verified","source":"https://shopify.dev/docs/apps/build/authentication-authorization/client-secrets","note":null},{"claim":"A Partner account is not required to run shopify app init; either a Partner account or merchant account with appropriate permissions works; app is created in the Dev Dashboard; dev store needed.","status":"verified","source":"https://shopify.dev/docs/apps/getting-started/create","note":"Cost of Partner account/dev stores not stated on the page."},{"claim":"Protected customer data levels 0/1/2, request flow in Partner Dashboard API access requests, Level 1/2 requirements, possible data protection review, public apps require review for both levels, dev-store-only apps need no review submission.","status":"verified","source":"https://shopify.dev/docs/apps/launch/protected-customer-data","note":"No review timeline given on the page."},{"claim":"Protected customer data scopes can be declared but API does not return data from non-development stores until approved; read_all_orders needs approval, otherwise last 60 days only; other approval-gated scopes error with app_access if declared early.","status":"verified","source":"https://shopify.dev/docs/api/usage/access-scopes","note":null},{"claim":"Scopes are a comma-separated string in [access_scopes]; optional_scopes available; use_legacy_install_flow=true passes scopes via URL, not recommended; auth.redirect_urls required and at least one needed before going public.","status":"verified","source":"https://shopify.dev/docs/apps/build/cli-for-apps/app-configuration","note":"Page did not document HTTPS/localhost/wildcard/max-count rules for redirect URLs."},{"claim":"Managed installation vs manual installation: managed installs and updates scopes without calling the app; manual uses authorization code grant.","status":"verified","source":"https://shopify.dev/docs/apps/build/authentication-authorization/app-installation","note":null},{"claim":"App Store review: requires OAuth install flow redirect to grant screen, Shopify billing for all charges, production-ready app, agreement acceptance, resubmission slows; no timeline or GDPR webhook content on this page.","status":"verified","source":"https://shopify.dev/docs/apps/launch/app-store-review/pass-app-review","note":null},{"claim":"Mandatory compliance webhooks customers/data_request, customers/redact, shop/redact are required for every App Store app, must be subscribed before review, return 401 on bad HMAC, complete within 30 days; shop/redact payload 48 hours after uninstall.","status":"verified","source":"https://shopify.dev/docs/apps/build/compliance/privacy-law-compliance","note":null},{"claim":"GraphQL Admin API rate limits: Standard 100, Advanced 200, Plus 1000, Enterprise 2000 points/second; single query max cost 1000.","status":"verified","source":"https://shopify.dev/docs/apps/build/apis/graphql-admin/rate-limits","note":"Max cost 1000 came from the example error text on https://shopify.dev/docs/api/admin-graphql; the rate-limits page gave the per-plan table. Bucket size per plan not stated."},{"claim":"REST Admin API uses a request-based leaky bucket; 10,000 new variants/day cap once a store has 500,000 variants (not Plus).","status":"verified","source":"https://shopify.dev/docs/api/usage/limits","note":"Per-plan REST figures not given on page."},{"claim":"Typical App Store review takes 2+ weeks.","status":"inferred","source":"https://community.shopify.dev/t/shopify-app-review-taking-more-than-2-weeks-is-this-normal/29646","note":"Community poster was told 'up to 2 weeks' on Jan 30, 2026 and was still waiting past two weeks; a Shopify staff reply linked a post titled 'Longer App Store Review Times: What You Need to Know' but its contents were not read. Other thread titles from search snippets mention 3 weeks. Not an official SLA."},{"claim":"Merchants unrelated to each other cannot all install a custom-distribution app, so an agent platform serving arbitrary merchants needs public distribution.","status":"inferred","source":"https://shopify.dev/docs/apps/launch/distribution","note":"Inferred from custom distribution being for a single merchant / one Plus org; docs do not explicitly say unrelated stores are blocked."},{"claim":"Composio's Shopify toolkit collects the shop subdomain from the user before redirecting, and the Composio callback works as the app's allowed redirect URL.","status":"unverified","source":null,"note":"Composio docs were not fetched in this task; derived from Shopify's shop-specific URL design."},{"claim":"Partner account, Dev Dashboard and dev stores are free.","status":"unverified","source":null,"note":"Not stated on any fetched page."}],"uncertainties":["No official App Store review turnaround was found; the 2+ weeks figure is community-reported, and the contents of Shopify's 'Longer App Store Review Times' post were not read.","Protected customer data review timeline is not published on the page fetched.","Exact rules for allowed redirect URLs (HTTPS requirement, wildcards, count limits, whether a non-app-owned domain like Composio's is accepted without issue) were not on any fetched page; the manual-installation page failed to load. Acceptance of the Composio callback is inferred.","How Composio handles the per-shop subdomain, HMAC validation, and expiring offline token refresh for Shopify was not checked (Composio docs not fetched).","The exact January 1, 2026 date for legacy custom app creation comes from a community.shopify.dev announcement thread; shopify.dev pages state the restriction without a date.","Whether Dev Dashboard / Partner account creation has any fee or identity verification step was not confirmed (login-gated pages not read).","GraphQL per-plan bucket size and REST per-plan limits were not confirmed on fetched pages."],"lastChecked":"2026-10-20"},{"slug":"spotify","name":"Spotify","composioSlug":"SPOTIFY","website":"https://developer.spotify.com","summary":"Creating the Spotify app takes minutes and is self-serve, but it starts in Development Mode (owner needs Premium, max 5 allow-listed users), and lifting that cap via Extended Quota Mode requires an organization-level Partner Application with criteria that include at least 250k monthly active users.","difficulty":5,"difficultyWhy":"Getting credentials is trivial (difficulty 1), but serving arbitrary end users requires Extended Quota Mode, which Spotify documents as org-only, requiring an established business, a launched service, 250k+ MAUs and up to six weeks of review. Most agent-platform developers will not qualify, so production use is effectively gated.","time":{"setup":"~10 min","approval":"up to 6 weeks for the quota extension review (per Spotify docs), after a separate Partner Application is approved; no approval needed for Development Mode","total":"same day for a 5-user dev-mode setup; 6+ weeks (and possibly never, if criteria are not met) for Extended Quota Mode"},"gatingModel":"review-required","devModeLimits":"New apps start in Development Mode: the app owner must have an active Spotify Premium subscription (app stops working if it lapses); up to 5 authenticated Spotify users, each manually added under Settings > Users Management (non-allow-listed users can log in but their API calls return 403); low per-developer-account quota shared across all Development Mode apps (429 with reason QUOTA_EXCEEDED); new Development Mode apps get a reduced endpoint set (batch fetches, browse endpoints, other-user endpoints and several response fields removed, search limit max 10); up to 25 Client IDs per developer account.","stages":[{"name":"Create app in Developer Dashboard","duration":"10 min","owner":"you"},{"name":"Add redirect URI and copy client ID/secret into Composio custom auth config","duration":"5 min","owner":"agent"},{"name":"Allow-list up to 5 test users in Users Management","duration":"5 min","owner":"you"},{"name":"Submit Partner Application (company email) for Extended Quota","duration":"30-60 min","owner":"you"},{"name":"Complete Quota extension Request questionnaire in app Settings","duration":"30-60 min","owner":"you"},{"name":"Spotify compliance review","duration":"up to 6 weeks","owner":"provider"}],"steps":[{"n":1,"title":"Make sure the app owner account has Spotify Premium","detail":"Development Mode apps require the app owner to have an active Spotify Premium subscription. If the subscription lapses the app stops working until the owner resubscribes. Use a dedicated account that will keep Premium.","owner":"you","url":"https://developer.spotify.com/documentation/web-api/tutorials/february-2026-migration-guide"},{"n":2,"title":"Create the app in the Developer Dashboard","detail":"Log into the Spotify Developer Dashboard, click 'Create an App', enter App Name and App Description (both are shown to users on the grant screen), tick the Developer Terms of Service checkbox, and click CREATE. You land on the app overview page showing Client ID, Client Secret, App Status (Development Mode) and metrics. Up to 25 apps per developer account.","owner":"you","url":"https://developer.spotify.com/documentation/web-api/concepts/apps"},{"n":3,"title":"Register the Composio redirect URI","detail":"App > Edit Settings > Redirect URIs: add exactly https://backend.composio.dev/api/v3/toolkits/auth/callback and click SAVE. It is an HTTPS non-loopback URI so it satisfies Spotify's rule (HTTPS required except loopback). Spotify requires an exact match between the registered URI and the one sent in the authorization request. Optionally fill in Website.","owner":"you","url":"https://developer.spotify.com/documentation/web-api/concepts/redirect_uri"},{"n":4,"title":"Copy Client ID and Client Secret","detail":"From the app overview page copy Client ID and reveal/copy Client Secret. Keep the secret out of source control; use the ROTATE button if it leaks (rotation will break existing configs until updated).","owner":"you","url":"https://developer.spotify.com/documentation/web-api/concepts/apps"},{"n":5,"title":"Create a custom auth config in Composio for SPOTIFY","detail":"Create a custom OAuth2 auth config for the SPOTIFY toolkit using the client ID and secret, and request only the scopes your agent needs (e.g. user-read-playback-state, user-modify-playback-state, user-read-currently-playing, playlist-read-private, playlist-modify-private, playlist-modify-public, user-library-read, user-library-modify, user-top-read, user-read-recently-played). Spotify has no managed Composio app, so there is no shared fallback.","owner":"agent","url":null},{"n":6,"title":"Allow-list each test user","detail":"Developer Dashboard > app > Settings > Users Management > Add new user. Each user (max 5 in Development Mode) must be added by their Spotify account name/email before connecting; otherwise they can log in but all API requests return 403.","owner":"you","url":"https://developer.spotify.com/documentation/web-api/concepts/quota-modes"},{"n":7,"title":"(Production) Submit Partner Application for Extended Quota","detail":"Extended Quota Mode: submit the Partner Application via the form linked on the quota-modes page, using a company email. Spotify only accepts organizations, not individuals (since 15 May 2025). Listed requirements: established business entity, active launched service, minimum 250k MAUs, availability in key Spotify markets, commercial viability, adherence to Terms.","owner":"you","url":"https://developer.spotify.com/documentation/web-api/concepts/quota-modes"},{"n":8,"title":"(Production) Submit the quota extension request","detail":"After the Partner Application is approved: app Settings > 'Quota extension Request' tab, complete the 4-step questionnaire and submit; status shows 'Sent'. Spotify reviews against its Developer Policy; docs say the review can take up to six weeks and feedback is emailed to the Spotify account's address.","owner":"you","url":"https://developer.spotify.com/documentation/web-api/concepts/quota-modes"}],"requirements":["A Spotify account to log into the Developer Dashboard; the app owner must have active Spotify Premium for Development Mode apps (since Feb 2026)","Acceptance of the Developer Terms of Service (checkbox at app creation)","HTTPS redirect URI (Composio's callback qualifies); loopback IP literals may use HTTP","For Extended Quota Mode: a legally registered business/organization, company email for the Partner Application, an active launched service, at least 250k MAUs, availability in key Spotify markets, commercial viability, and adherence to Spotify's terms","Each end user in Development Mode must be added to the allowlist (max 5) by the developer"],"gotchas":["Development Mode caps at 5 authenticated users and each must be manually allow-listed; unlisted users get 403 on API calls even though login succeeds.","Since the Feb 2026 changes, the Development Mode app owner needs active Premium or the whole app stops working (affects every connected user).","Extended Quota Mode is organization-only since 15 May 2025; individuals and small startups without 250k MAUs are unlikely to qualify under the documented criteria.","Dev-mode quota is counted per developer account (since 23 Jul 2026 announcement), shared across all your Development Mode Client IDs; exceeding it returns 429 with JSON reason QUOTA_EXCEEDED, which is distinct from the 30-second rolling-window rate limit.","New Development Mode apps get a reduced endpoint set: batch GET /tracks, /albums, /artists etc., browse new-releases/categories, artist top-tracks, GET /users/{id}, GET /markets are removed; playlist /tracks became /items and playlist items are readable only for playlists the user owns/collaborates on; search limit max is 10 (default 5). Several fields (e.g. popularity, available_markets, GET /me product/email/country) are removed. Extended Quota apps are unaffected. An agent toolkit may call endpoints that no longer work for dev-mode apps.","Refresh tokens last 6 months from the user's authorization and refreshing does not extend them; after that users must re-authorize (invalid_grant). Access tokens last 1 hour.","A refresh response may or may not include a new refresh token; keep using the existing one if none is returned.","Playback control endpoints (e.g. start/resume playback) only work for users with Spotify Premium, regardless of app mode; the 'streaming' s
