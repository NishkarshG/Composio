cope is Premium-only.","Redirect URIs must match exactly; 'localhost' is not allowed (use 127.0.0.1 or [::1]); Spotify said enforcement of stricter validation began 9 April 2025 for new apps and expected all clients to migrate by November 2025.","Spotify notes dev-mode quota groupings and limits are 'subject to change'; numeric limits are not published on the pages read."],"blockers":[{"blocker":"More than 5 users need access","symptom":"Users beyond the allowlist can complete login but every API call returns 403; Users Management cannot exceed 5 in Development Mode (for new apps).","whatToDo":"Either keep the deployment to 5 users (e.g. internal/personal use), or apply for Extended Quota Mode if the organization meets the criteria. There is no documented alternative path.","escalation":"https://community.spotify.com/t5/Spotify-for-Developers/bd-p/Spotify_Developer"},{"blocker":"Does not meet Extended Quota criteria (organization, 250k MAU, launched service)","symptom":"Partner Application or quota extension request rejected or unanswered; feedback arrives by email.","whatToDo":"Review the six criteria on the quota-modes page, ensure the service is launched and applying from a company email, address review feedback, and reapply. If criteria cannot be met, consider whether Spotify is viable for a multi-tenant agent product.","escalation":"Spotify for Developers community forum (Spotify_Developer board) - exact support channel for extension appeals not confirmed"},{"blocker":"App owner's Premium subscription lapses","symptom":"Development Mode app stops working for all users until the owner resubscribes.","whatToDo":"Keep Premium active on the owner account; set a billing reminder.","escalation":null},{"blocker":"429 QUOTA_EXCEEDED in Development Mode","symptom":"429 response with JSON body reason QUOTA_EXCEEDED; shared across all Development Mode Client IDs on the developer account.","whatToDo":"Reduce call volume, cache, avoid polling, and respect Retry-After; extend quota via Extended Quota Mode if eligible.","escalation":null},{"blocker":"Refresh token expired (6 months)","symptom":"Token endpoint returns invalid_grant on refresh.","whatToDo":"Discard the token and have the user reconnect through Composio.","escalation":null}],"agentCanDo":["Explain every step and prepare exact field values (app name/description text, redirect URI, scope list)","Create the Composio custom auth config once the developer supplies client ID/secret, and generate connect links","Draft the Partner Application and 4-step quota extension questionnaire answers for human review","Handle token refresh, 429/Retry-After backoff and invalid_grant reconnect flows in code","Monitor whether API calls hit removed dev-mode endpoints and map them to the replacement endpoints (e.g. /playlists/{id}/items, /me/library)"],"youMustDo":["Log into the Spotify Developer Dashboard and create the app (account login, Developer Terms checkbox)","Maintain an active Spotify Premium subscription on the app owner account (payment)","Copy the client secret into Composio securely","Manually add each end user (max 5) in Users Management","Submit the Partner Application from a company email and the quota extension questionnaire; attest to business details and legal terms","Respond to Spotify review emails"],"composio":{"redirectUri":"https://backend.composio.dev/api/v3/toolkits/auth/callback","note":"Composio has no managed Spotify app, so a custom auth config is mandatory. The Composio callback is an HTTPS non-loopback URI, which Spotify accepts; register it verbatim in the app's Redirect URIs (exact match required, no wildcard support documented). The Authorization Code flow with client secret uses HTTP Basic auth of client_id:client_secret at https://accounts.spotify.com/api/token. In Development Mode only the 5 allow-listed Spotify users can connect through Composio, and Composio-exposed tools that use endpoints removed for new dev-mode apps may return errors."},"evidence":[{"claim":"New apps start in Development Mode; up to 5 authenticated users; each must be added to allowlist via Dashboard > app > Settings > Users Management > Add new user; non-allow-listed users get 403.","status":"verified","source":"https://developer.spotify.com/documentation/web-api/concepts/quota-modes","note":null},{"claim":"Development Mode quota is per developer account, shared bucket groupings subject to change; exceeding returns 429 with reason QUOTA_EXCEEDED, separate from rate limits.","status":"verified","source":"https://developer.spotify.com/documentation/web-api/concepts/quota-modes","note":"Numeric quota values are not published on this page."},{"claim":"Extended Quota Mode: unlimited users, higher rate limit; since 15 May 2025 only organizations (not individuals) are accepted.","status":"verified","source":"https://developer.spotify.com/documentation/web-api/concepts/quota-modes","note":null},{"claim":"Extended Quota requirements: established business entity, active launched service, at least 250k MAUs, key Spotify markets, commercial viability, adherence to terms; Partner Application via company email.","status":"verified","source":"https://developer.spotify.com/documentation/web-api/concepts/quota-modes","note":"Fetched page content was summarized by the fetch tool; wording of the 250k figure was read from that summary rather than raw HTML."},{"claim":"After Partner Application approval, request via app Settings > Quota extension Request tab, 4-step questionnaire; review can take up to six weeks; feedback by email.","status":"verified","source":"https://developer.spotify.com/documentation/web-api/concepts/quota-modes","note":null},{"claim":"April 2025 post updated Extended Access criteria to 'established, scalable and impactful use cases'; criteria limited to new framework from 15 May 2025; no numeric thresholds in the post; no review timeline given in the post.","status":"verified","source":"https://developer.spotify.com/blog/2025-04-15-updating-the-criteria-for-web-api-extended-access","note":"The post does not state the 250k MAU threshold; that figure appears only on the quota-modes page."},{"claim":"App creation steps: Create an App, App Name, App Description (shown on grant screen), Developer Terms checkbox, CREATE; up to 25 apps per developer account; Client ID/Secret on overview; ROTATE for secret.","status":"verified","source":"https://developer.spotify.com/documentation/web-api/concepts/apps","note":null},{"claim":"Redirect URIs: HTTPS required except loopback (HTTP allowed); localhost not allowed, use 127.0.0.1 or [::1]; exact match; loopback may omit port at registration.","status":"verified","source":"https://developer.spotify.com/documentation/web-api/concepts/redirect_uri","note":null},{"claim":"Redirect URI validation enforcement began 9 April 2025 for new apps; all clients expected to migrate by November 2025.","status":"verified","source":"https://developer.spotify.com/documentation/web-api/concepts/redirect_uri","note":"The specific validations are not listed on the page; they are in a linked blog post that was not fetched."},{"claim":"Wildcard redirect URIs are not documented as supported.","status":"inferred","source":"https://developer.spotify.com/documentation/web-api/concepts/redirect_uri","note":"The page does not mention wildcards; exact-match rule implies none."},{"claim":"Feb 6 2026 announcement: Development Mode requires Premium; one Client ID per developer; five users per Client ID; new Client IDs affected from 11 Feb 2026; existing integrations from 9 March; endpoint changes for existing integrations postponed.","status":"verified","source":"https://developer.spotify.com/blog/2026-02-06-update-on-developer-access-and-platform-security","note":"Later changes (July 2026) raised the Client ID limit; see next claim."},{"claim":"23 July 2026 post: Client ID limit raised from 1 to 25 per developer account; quota now counted per developer account; QUOTA_EXCEEDED JSON body on 429.","status":"verified","source":"https://developer.spotify.com/blog/2026-07-23-web-api-quota-updates","note":"Post gives no numeric quota values and no separate effective date."},{"claim":"Migration guide: owner must have active Premium or app stops working; existing apps keep current Client IDs/users; Extended Quota apps not affected; list of removed endpoints/fields; search limit max 10 default 5.","status":"verified","source":"https://developer.spotify.com/documentation/web-api/tutorials/february-2026-migration-guide","note":"Guide says endpoint restrictions migrate existing apps from 9 Mar 2026 whereas the 6 Feb blog said endpoint changes for existing integrations were postponed with no date; the guide appears newer/more specific but the conflict was not resolved. External_ids fields were reverted per March 2026 changelog (not fetched)."},{"claim":"Access tokens last 1 hour; refresh tokens last 6 months from authorization and refreshing does not extend them; refresh response may omit a new refresh token; invalid_grant on expired.","status":"verified","source":"https://developer.spotify.com/documentation/web-api/tutorials/refreshing-tokens","note":null},{"claim":"Token endpoint is POST https://accounts.spotify.com/api/token, form-encoded; Authorization Code uses Basic base64(client_id:client_secret); PKCE sends client_id in body.","status":"verified","source":"https://developer.spotify.com/documentation/web-api/tutorials/refreshing-tokens","note":null},{"claim":"Rate limit is calculated over a rolling 30-second window; 429 includes Retry-After in seconds; extended mode has much higher limit; numeric limits not published.","status":"verified","source":"https://developer.spotify.com/documentation/web-api/concepts/rate-limits","note":null},{"claim":"Spotify defines 25 scopes including ugc-image-upload, user-read-playback-state, user-modify-playback-state, playlist-*, user-library-*, user-top-read, user-read-recently-played, streaming, plus Open Access (soa) scopes; only 'streaming' is marked Premium-only on the scopes page.","status":"verified","source":"https://developer.spotify.com/documentation/web-api/concepts/scopes","note":null},{"claim":"Start/resume playback endpoint only works for users with Spotify Premium and needs user-modify-playback-state.","status":"verified","source":"https://developer.spotify.com/documentation/web-api/reference/start-a-users-playback","note":"Other player endpoints likely have the same Premium note but were not individually checked."},{"claim":"Scopes do not require separate Spotify review; they are requested at authorization time and granted by the user.","status":"inferred","source":"https://developer.spotify.com/documentation/web-api/concepts/scopes","note":"No page read mentions a per-scope review step; absence is inferred. Extended Quota review is app-level."},{"claim":"Community support channel is the Spotify for Developers community forum.","status":"inferred","source":null,"note":"A community.spotify.com Spotify-for-Developers thread appeared in search results but the board URL given in blockers was not fetched; verify before relying on it."}],"uncertainties":["Numeric Development Mode quota and rate limit values are not published on any page read.","Whether the 250k MAU threshold is strictly enforced or has exceptions for new/small organizations is unknown; Spotify's April 2025 blog gives no numeric threshold, and it is stated only on the quota-modes page.","Actual real-world Extended Quota review timing and approval rates for small developers (docs say up to six weeks; no community reports were examined).","Conflict between the 6 Feb 2026 blog (endpoint restrictions for existing apps postponed) and the migration guide (existing apps migrated 9 March 2026) was not resolved; the status of endpoint restrictions on pre-existing apps is unclear.","The exact Partner Application form URL and the specific support/appeal channel were not confirmed; the Dashboard URL itself was not fetched (steps point to the docs page that describes it).","Whether Composio's Spotify toolkit actions depend on endpoints removed for new dev-mode apps was not checked.","The 9 April 2025 redirect URI validations list was not read (linked blog post not fetched)."],"lastChecked":"2026-10-20"},{"slug":"twitter","name":"X (formerly Twitter) API v2","composioSlug":"TWITTER","website":"https://console.x.com","summary":"Sign in at the X Developer Console, accept the Developer Agreement, create an app with a name, description and use case, enable OAuth 2.0 (confidential Web App), add the Composio callback URL, load pay-per-use credits, and copy the Client ID and Secret into a Composio custom auth config.","difficulty":2,"difficultyWhy":"App creation is self-serve and fast, and the docs describe no manual approval step. The friction is that the API is pay-per-use, so you need a saved payment card and a credit balance before requests succeed, and X reserves the right to suspend apps whose use deviates from the stated use case.","time":{"setup":"~15 min","approval":"none documented (no review step described in X docs)","total":"same day (add time for payment/credit setup)"},"gatingModel":"self-serve-with-limits","devModeLimits":"No documented pre-approval sandbox or user cap. Pay-per-usage plans are capped at 3 million Post reads per monthly billing cycle, requests are blocked once your spending limit is hit or the credit balance is negative, and higher volume requires an Enterprise plan. Per-endpoint rate limits apply (for example POST /2/tweets 100/15min per user, 10,000/24hrs per app).","stages":[{"name":"Sign in to Developer Console and accept Developer Agreement","duration":"5 min","owner":"you"},{"name":"Create app (name, description, use case)","duration":"5 min","owner":"you"},{"name":"Configure OAuth 2.0 auth settings, callback URL, scopes/permissions","duration":"5 min","owner":"you"},{"name":"Add payment method / buy credits, set spending limit","duration":"5-10 min","owner":"you"},{"name":"Create Composio custom auth config with Client ID/Secret","duration":"5 min","owner":"agent"}],"steps":[{"n":1,"title":"Sign in to the X Developer Console","detail":"Go to console.x.com, sign in with the X account that will own the app, and accept the Developer Agreement. Use an account that represents your company or product, since the app is tied to it.","owner":"you","url":"https://console.x.com"},{"n":2,"title":"Add credits / payment method (pay-per-use)","detail":"X API v2 is billed pay-per-usage with no subscriptions or minimum spend. Buy credits in the Developer Console, optionally enable auto-recharge (requires a saved default payment method) and set a maximum spend per billing cycle. Requests are blocked when the balance goes negative or the spending limit is reached. Exact placement of the billing screens in the console was not read this session.","owner":"you","url":"https://docs.x.com/x-api/getting-started/pricing"},{"n":3,"title":"Create the app","detail":"Click New App / Create App and enter a name, description and use case. Be accurate and specific about the use case: the X Developer Policy says failing to disclose a substantive change to your approved use case can lead to suspension. Keys and tokens are shown only once, so save them immediately; regenerating invalidates the old ones. Use separate apps for dev, staging and production (policy allows up to three apps for the same service, registered to one account and clearly labeled).","owner":"you","url":"https://docs.x.com/resources/fundamentals/developer-apps"},{"n":4,"title":"Enable OAuth 2.0 and choose app type","detail":"Open the app's authentication settings (App settings) and select OAuth 2.0 (you may enable OAuth 1.0a as well, but Composio needs OAuth 2.0 client credentials). Choose a confidential type, Web App or Automated App/Bot, so that a Client Secret is issued. Native App and Single Page App are public clients with no secret.","owner":"you","url":"https://docs.x.com/resources/fundamentals/authentication/oauth-2-0/authorization-code"},{"n":5,"title":"Add the Composio callback URL","detail":"In the app's callback URL allowlist add exactly: https://backend.composio.dev/api/v3/toolkits/auth/callback . Matching is exact (including trailing slashes), maximum 10 callback URLs per app, https required for production. If the console also asks for a Website URL, supply your own product URL (the docs read this session do not describe that field).","owner":"you","url":"https://docs.x.com/resources/fundamentals/developer-apps"},{"n":6,"title":"Copy Client ID and Client Secret","detail":"In the app's Keys and Tokens section copy the OAuth 2.0 Client ID and Client Secret (the secret is shown once for confidential apps; regenerate if lost). Do not confuse these with the OAuth 1.0a API Key/Secret or the Bearer token.","owner":"you","url":"https://docs.x.com/resources/fundamentals/authentication/oauth-2-0/authorization-code"},{"n":7,"title":"Create the Composio custom auth config","detail":"In Composio, create a custom auth config for toolkit TWITTER (OAuth2) with the Client ID and Client Secret, and select the scopes your agent needs. Typical set: tweet.read tweet.write users.read offline.access, plus like.read/like.write, follows.read/follows.write, bookmark.read/bookmark.write, dm.read/dm.write, media.write only if needed. Always include offline.access if you want refresh tokens.","owner":"agent","url":null},{"n":8,"title":"Test with a real connection","detail":"Run a connect flow from your Composio project against your own X account, verify tweet.read and one write call work, and check the Developer Console usage/credit meter to confirm billing is behaving as expected.","owner":"you","url":null}],"requirements":["An X account (to sign in at console.x.com) and acceptance of the Developer Agreement","A payment method and a credit balance: X API v2 is pay-per-usage (new users may earn $20 in free credits when saving a first eligible payment card, per the pricing page)","A description and use case entered at app creation, consistent with actual use","Compliance with the X Developer Policy and Automation Rules for any write actions (posting, following, DMs)","Enterprise plan only if you need volume above the pay-per-usage cap (3 million Post reads per monthly billing cycle) or team management"],"gotchas":["Pay-per-use means every read and write consumes credits (examples: post create $0.015, post create containing a URL $0.20, post read $0.005 per resource). If the balance goes negative or the spend limit is hit, API requests are blocked, which will look like connection or tool-call failures to your users.","Rate limits and usage billing are separate: you can hit rate limits without extra cost, or be within limits and still incur cost.","Redirect URI must exactly match an allowlisted callback URL (trailing slash matters); max 10 per app; use http://127.0.0.1 not localhost for local dev (irrelevant for Composio, which uses https).","Authorization codes expire 30 seconds after approval.","OAuth 2.0 access tokens last two hours by default; a refresh token is only issued if the offline.access scope is requested. Docs read this session do not state refresh token lifetime or rotation, so store the newest refresh token returned on each refresh.","Confidential clients authenticate to the token endpoint with HTTP Basic (Client ID:Secret). Public clients (Native, SPA) have no secret and Composio custom auth expects a client secret, so choose Web App or Automated App/Bot.","App permission levels (Read, Read and write, Read+write+DM) are documented for OAuth 1.0a. For OAuth 2.0 the granted capability comes from the requested scopes; check that the app permission setting is not left at Read only if write calls fail. Changing permissions forces users to re-authorize.","Scope names in X docs are inconsistent: the scope table lists follows.read/follows.write while an example URL uses account.follows.read/write. Use the table names.","Do not register multiple apps for the same or overlapping use cases (only dev/staging/prod, max three, same account, clearly labeled). A white-label offering where each customer gets their own app/branding needs separate approval from X.","Your product must monitor its own users for policy violations (spam, bulk follows, identical content across accounts); failure can lead to suspension of the developer app and thereby all connected users."],"blockers":[{"blocker":"API calls fail with payment or credit errors","symptom":"Requests rejected after setup works; spending limit reached or negative balance","whatToDo":"Add credits, enable auto-recharge, raise the per-cycle spending limit in the Developer Console, and monitor usage.","escalation":"https://devcommunity.x.com"},{"blocker":"Redirect URI mismatch","symptom":"Authorization page error stating the redirect_uri is invalid or does not match","whatToDo":"Add https://backend.composio.dev/api/v3/toolkits/auth/callback exactly to the app's callback URLs with no trailing slash differences, then save and retry.","escalation":null},{"blocker":"App suspended or API access revoked","symptom":"All users' tool calls start failing with 401/403 or the app disappears from the console","whatToDo":"Review the X Developer Policy and Automation Rules, fix the violation and disclose use-case changes, then appeal through X support. Keep separate dev/prod apps so testing does not endanger production.","escalation":"https://devcommunity.x.com"},{"blocker":"No client secret issued","symptom":"Only a Client ID is shown in Keys and Tokens","whatToDo":"App type is a public client (Native App or SPA). Switch the app type to Web App or Automated App/Bot in the authentication settings and regenerate the secret.","escalation":null},{"blocker":"Volume exceeds pay-per-usage cap","symptom":"Post reads blocked after 3 million in a billing cycle","whatToDo":"Contact X to upgrade to an Enterprise plan via the form linked from the pricing page.","escalation":"https://docs.x.com/x-api/getting-started/pricing"}],"agentCanDo":["Prepare the exact callback URL, scope list and app-type instructions for the developer","Create the Composio custom auth config once given the Client ID and Client Secret","Run a test connection and sample API calls through Composio, and explain errors such as redirect mismatch, 401/403, or credit exhaustion","Draft an accurate use-case description and a policy-compliance checklist for the developer to paste in"],"youMustDo":["Sign in to console.x.com with your X account (login, 2FA) and accept the Developer Agreement","Enter payment details, buy credits and set spending limits (payment)","Create the app, enable OAuth 2.0, add the callback URL and copy the Client ID/Secret","Be truthful in the use-case description and comply with X policies"],"composio":{"redirectUri":"https://backend.composio.dev/api/v3/toolkits/auth/callback","note":"Composio has no managed OAuth app for TWITTER, so you must supply your own OAuth 2.0 Client ID and Client Secret from a confidential app type (Web App or Automated App/Bot). Allowlist the redirect URI exactly. Request offline.access in the auth config scopes so Composio can refresh the 2-hour access tokens. Note that all of your end users' API usage is billed to your X developer app's credits, since Composio uses your app credentials."},"evidence":[{"claim":"X API v2 uses pay-per-usage pricing with no subscriptions; the pricing page describes no fixed Free/Basic/Pro tiers, and Enterprise appears only as the upgrade path for higher volume","status":"verified","source":"https://docs.x.com/x-api/getting-started/pricing","note":"Read via WebFetch on 2026-10-20. The page gives no effective date for the prices and says current rates are in the Developer Console."},{"claim":"Example prices: Post read $0.005, User read $0.010, Post create $0.015, Post create with URL $0.200, owned reads $0.001","status":"verified","source":"https://docs.x.com/x-api/getting-started/pricing","note":"Page text was readable (not JS-blocked) on 2026-10-20; prices may change."},{"claim":"Pay-per-usage capped at 3 million Post reads per monthly billing cycle; spending limits and negative balance block requests; auto-recharge needs a saved default payment method; no minimum spend; new users may earn $20 free credits on saving a first eligible card","status":"verified","source":"https://docs.x.com/x-api/getting-started/pricing","note":null},{"claim":"The legacy Free tier was effectively discontinued in Feb 2026 and Basic/Pro were kept as opt-in legacy options","status":"inferred","source":"https://roboin.io/article/en/2026/02/08/x-transitions-api-to-pay-per-use-model-ending-free-plan/","note":"Third-party news article dated 2026-02-08, not an official X page. Official docs read this session do not mention legacy tiers either way."},{"claim":"Sign up at console.x.com with an X account and accept the Developer Agreement; create app with name and description; credentials shown once","status":"verified","source":"https://docs.x.com/resources/fundamentals/developer-portal","note":null},{"claim":"App creation asks for name, description and use case; permission levels Read / Read and write / Read, write and DMs are documented for OAuth 1.0a; app types Web App, Automated App/Bot (confidential), Native App, Single Page App (public)","status":"verified","source":"https://docs.x.com/resources/fundamentals/developer-apps","note":null},{"claim":"Callback URLs: exact match including trailing slash, max 10 per app, https for production, http://127.0.0.1 for local dev (not localhost), some protocols disallowed","status":"verified","source":"https://docs.x.com/resources/fundamentals/developer-apps","note":null},{"claim":"OAuth 2.0 Authorization Code with PKCE: authorize URL https://x.com/i/oauth2/authorize, token URL https://api.x.com/2/oauth2/token, S256 or plain challenge, state up to 500 chars, redirect_uri must match app settings","status":"verified","source":"https://docs.x.com/resources/fundamentals/authentication/oauth-2-0/authorization-code","note":null},{"claim":"Scope list: tweet.read, tweet.write, tweet.moderate.write, users.email, users.read, follows.read/write, offline.access, space.read, mute.read/write, like.read/write, list.read/write, block.read/write, bookmark.read/write, dm.read/write, media.write, broadcast.read/write","status":"verified","source":"https://docs.x.com/resources/fundamentals/authentication/oauth-2-0/authorization-code","note":"The same page's example URL uses account.follows.read/write which are not in the table."},{"claim":"Access tokens valid two hours by default; offline.access required to receive a refresh token; authorization codes expire 30 seconds after approval","status":"verified","source":"https://docs.x.com/resources/fundamentals/authentication/oauth-2-0/authorization-code","note":"The separate user-access-token page does not state a lifetime."},{"claim":"Refresh via POST to the token endpoint with grant_type=refresh_token; confidential clients use Basic auth with Client ID:Secret; revoke endpoint https://api.x.com/2/oauth2/revoke","status":"verified","source":"https://docs.x.com/resources/fundamentals/authentication/oauth-2-0/user-access-token","note":"Refresh token lifetime and rotation behavior are not specified on this page."},{"claim":"Confidential clients (Web App, Automated App/Bot) receive a client secret; public clients (Native, SPA) cannot keep a secret; Client ID/Secret found in Keys and Tokens","status":"verified","source":"https://docs.x.com/resources/fundamentals/authentication/oauth-2-0/authorization-code","note":null},{"claim":"Rate limits per 15 min unless noted: POST /2/tweets 100/user and 10,000/24hrs per app; GET /2/users/me 75/user; GET /2/tweets/search/recent 450 app/300 user; DELETE /2/tweets/:id 50/user; POST /2/users/:id/following 50/user; Enterprise has custom limits","status":"verified","source":"https://docs.x.com/x-api/fundamentals/rate-limits","note":"Page does not describe limits varying by tier; Developer Console is the place to view current limits."},{"claim":"No manual app review or approval step is described for getting API access: sign up, create app, get credentials","status":"verified","source":"https://docs.x.com/x-api/getting-started/about-x-api","note":"Absence of mention is not proof no review exists; the Developer Policy mentions an 'approved use case', so some review may occur behind the scenes."},{"claim":"X may suspend or permanently revoke API access for policy violations; undisclosed substantive use-case changes can cause suspension; write-action services must follow Automation Rules; rate limits may not be circumvented; no multiple apps for the same use case except up to three dev/staging/prod apps on one account","status":"verified","source":"https://docs.x.com/developer-terms/policy.md","note":"Policy states it may change without notice."},{"claim":"Enterprise-only team management (inviting members by X handle)","status":"verified","source":"https://docs.x.com/resources/fundamentals/developer-portal","note":null},{"claim":"OAuth 1.0a and OAuth 2.0 can both be enabled on the same app; Composio only needs OAuth 2.0","status":"verified","source":"https://docs.x.com/resources/fundamentals/authentication/oauth-2-0/authorization-code","note":"That Composio only needs OAuth 2.0 is inferred from the task context that Composio takes a client ID/secret with a single redirect URI."},{"claim":"The Composio redirect URI works with X (callback allowlisted exactly) and nothing blocks third-party domains","status":"inferred","source":"https://docs.x.com/resources/fundamentals/developer-apps","note":"Docs say any https callback can be allowlisted; no Composio-specific X test was done."}],"uncertainties":["Could not confirm whether new accounts must have a payment method on file before the first API call succeeds or whether the initial credit voucher covers testing; pricing page says new users can earn $20 credits on saving a card.","No effective date was found on the official pricing page, so the pay-per-use model is confirmed as current only as of the 2026-10-20 fetch; legacy Free/Basic/Pro status is known only from a third-party article (Feb 2026).","Refresh token lifetime and whether refresh tokens rotate on use are not stated in the official docs read this session.","Official docs read do not describe the 'User authentication settings' screen field by field (including whether Website URL and Terms/Privacy URLs are mandatory) or how OAuth 2.0 app permission settings interact with scopes.","Whether X performs any human review of the use-case description at app creation, and how long appeals of suspensions take, could not be verified.","Could not view the logged-in Developer Console itself (login wall), so exact UI labels and billing screen locations are taken from docs, not from the UI."],"lastChecked":"2026-10-20"},{"slug":"workday","name":"Workday","composioSlug":"WORKDAY","website":"https://developer.workday.com","summary":"Workday has no central OAuth app the developer can register: each customer's Workday tenant admin must run the 'Register API Client' task inside their own tenant (producing a per-tenant client ID/secret) and hand over tenant-specific authorize/token endpoints, so the developer cannot self-serve production access.","difficulty":5,"difficultyWhy":"OAuth clients live inside each customer tenant and are created by that customer's Workday administrator, so the developer depends on every customer and cannot obtain one global client ID/secret. A free developer tenant exists for building and testing, but production reach needs customer admins (and optionally partner/marketplace approval).","time":{"setup":"~15-30 min per tenant for an admin who has the security permissions (developer sandbox tenant: ~15 min to provision)","approval":"No central OAuth approval; each customer's internal change/security review (days to weeks, unverified). Built on Workday app review and Partner Order timing unpublished.","total":"Developer sandbox: same day. Each production customer: days to weeks depending on the customer's admin and change process (inferred). Marketplace/partner route: unknown, likely weeks to months."},"gatingModel":"partner-or-tenant-gated","devModeLimits":"A free personal-account development tenant on the Workday Build / Open Developer Platform lets you register your own API client against that sandbox only. Limits: one active development tenant at a time, max two created per 6 hours, tenant expires after 7 consecutive days without login. It holds no real customer data and cannot connect to customer tenants.","stages":[{"name":"Get a Workday developer tenant (optional, for building and testing)","duration":"~15 min after creating a free Workday Build account","owner":"you"},{"name":"Register an API client in the developer tenant and test the flow with Composio","duration":"30-60 min","owner":"you"},{"name":"Customer admin enables functional areas/security, runs Register API Client in the customer's tenant, and sends you Client ID, Client Secret and endpoints","duration":"Customer-dependent; days to weeks (inferred)","owner":"provider"},{"name":"Create a Composio custom auth config with that customer's credentials and endpoints","duration":"~10 min per customer","owner":"you"},{"name":"Optional: Partner programme / Built on Workday app review / Marketplace listing","duration":"Unpublished","owner":"provider"}],"steps":[{"n":1,"title":"Decide which Workday model you are on","detail":"Workday has no public app console where a third party registers one OAuth app that works for all customers. The API client is registered inside each customer tenant ('Register API Client' task), so client ID/secret are per-tenant. Alternatives: (a) per-customer API client (what Composio custom auth supports), (b) become a Workday partner and ship a 'Built on Workday' / Extend app that customers install from their App Manager, or (c) use ISU credentials or a refresh token generated by the customer admin.","owner":"you","url":"https://workday.com/en-us/company/partners/become-a-partner.html"},{"n":2,"title":"Get a developer sandbox tenant (for building and testing only)","detail":"Create a free account on the Workday Build platform with a personal email at developer.workday.com. Open Console > Tenants, click the + under Development Tenants and submit a request. Workday emails you (about 15 minutes per the docs) with sign-in details; sign in as lmcneil and change the password within 72 hours. One active tenant at a time; it expires after 7 days without login. A Workday blog post (27 Aug 2026) describes 'pilot access' via a waitlist at developer.workday.com/about; the getting-started doc describes self-serve creation, so current status of the waitlist is unclear.","owner":"you","url":"https://developer.workday.com/doc/GUID-4f875963-a845-43b5-868a-0f77e6261eb7-enHYPHENus.md"},{"n":3,"title":"Customer admin: enable required functional areas and security","detail":"A Workday tenant administrator with sufficient security permissions must make sure the Workday account that will authorize has access to the data via domain security policies, and run 'Activate Pending Security Policy Changes' after any policy change. Okta's guide shows the pattern of enabling functional areas in 'Maintain Functional Areas' and granting Get/Put on the relevant domains before registering the client. For ISU-based (non-interactive) access the admin also runs 'Create Integration System User' (Session Timeout Minutes = 0, exempt from password expiration), creates an Integration System Security Group, adds the ISU, and grants domain permissions via 'Maintain Permissions for Security Group'.","owner":"you","url":"https://help.okta.com/OIE/en-us/content/topics/ai-agents/ai-agent-configure-workday.htm"},{"n":4,"title":"Customer admin: run 'Register API Client' in the tenant","detail":"Search the tenant for 'Register API Client'. Client Name: unique descriptive name (e.g. 'Your App via Composio'). Client Grant Type: Authorization Code Grant. Access Token Type: Bearer. Redirection URI: https://backend.composio.dev/api/v3/toolkits/auth/callback (Workday reportedly allows only one redirect URI per client). Tick 'Non-Expiring Refresh Tokens'. Scope (Functional Areas): choose the areas that secure the endpoints you will call, e.g. Staffing, HRIS, System, Tenant Non-Configurable, Personal Data, Time Off and Leave, Recruiting; optionally 'Include Workday Owned Scope'. Click OK. Copy the Client ID and Client Secret immediately: the secret is not shown again after leaving the screen.","owner":"you","url":"https://nango.dev/docs/api-integrations/workday-oauth/how-to-register-your-own-workday-oauth-app"},{"n":5,"title":"Collect tenant-specific endpoints","detail":"Admin runs the 'View API Clients' report and copies the Authorization Endpoint, Token Endpoint and Workday REST API Endpoint. Observed patterns: authorize = https://<authorization-domain>/<tenant>/authorize; token = https://<token-domain>/ccx/oauth2/<tenant>/token; REST = https://<host>/ccx/api/v1/<tenant>/<resource>. The authorization, token and REST hosts can differ, especially on implementation (IMPL) or sandbox tenants, so use exact values from the report. Tenant name is case-sensitive.","owner":"you","url":"https://nango.dev/docs/api-integrations/workday-oauth/connect"},{"n":6,"title":"Optional: generate a refresh token for an ISU (API Client for Integrations)","detail":"For server-to-server style access, the admin runs 'Register API Client for Integrations', then in 'View API Clients' > 'API Clients for Integrations' tab selects the client, API Client > 'Manage Refresh Tokens for Integrations', enters the ISU in the 'Workday Account' field, ticks the generate/regenerate option and saves the refresh token. The refresh token must be non-expiring or refresh can fail.","owner":"you","url":"https://docs.workato.com/connectors/workday.html"},{"n":7,"title":"Create a Composio custom auth config per customer tenant","detail":"In Composio create a custom OAuth2 auth config for the WORKDAY toolkit with that tenant's Client ID, Client Secret and endpoints. Composio's toolkit page confirms there is no managed OAuth for Workday. Because Workday credentials and endpoints are per tenant, expect one auth config per customer tenant, or a custom flow if Composio cannot template tenant host/name (unverified).","owner":"agent","url":"https://docs.composio.dev/toolkits/workday"},{"n":8,"title":"Optional: partner / marketplace route","detail":"Workday offers Innovation Partner (Build), Sales and Services partner programmes via a partner portal. Apps built on the platform can be distributed as 'Built on Workday' apps: create the app on the Developer Site, submit for review from the Approval Status section, Workday approves, promote to Production, then complete the Partner Order process in the Built on Workday Digital Resource Room. Customers then install from App Manager. Requirements for the Partner Order and for Marketplace listing are not public.","owner":"you","url":"https://developer.workday.com/doc/GUID-14830fd0-75ea-44a8-990a-ecaed15f494e.md"}],"requirements":["For production: a customer with a Workday tenant and an administrator who has security access to run Register API Client, View API Clients and security policy tasks.","For sandbox: a free Workday Build / developer.workday.com account using a personal email (eligibility criteria not stated).","For the 'Built on Workday' distribution route: membership of a Producer account, Developer Site access, and a WCP development tenant account; then Workday review and the Partner Order process.","For partner status (Innovation Partner etc.): application via the Workday partner portal; criteria and fees not public.","Each customer's tenant must have OAuth 2.0 clients enabled (per Runlayer docs), and the registering admin or authorizing user needs domain security access to the data."],"gotchas":["Client ID/secret are per customer tenant: there is no single global OAuth app. One auth config per tenant is the likely shape.","Authorize URL contains the customer's Workday host and tenant name; token URL contains the data-center host and /ccx/oauth2/<tenant>/token. Hosts for authorize, token and REST can all differ, especially on IMPL/sandbox tenants.","Sources disagree on token URL shape: Nango shows /ccx/oauth2/<tenant>/token, Reco shows /ccx/oauth2/token. Copy exactly from the customer's View API Clients report.","The client secret is displayed only once on the registration confirmation screen.","Workday reportedly allows only one redirect URI per API client (CData docs), so the Composio callback must be entered exactly; a client cannot also serve other redirect URIs.","Tick 'Non-Expiring Refresh Tokens' at registration. Without a refresh token users must reauthenticate when the short-lived access token expires; a provided refresh token must be non-expiring.","Scopes are Workday functional areas, and their names vary by Workday release. Check the 'Secured by' section of each REST API in the tenant's own REST API reference. Missing domain permissions show up as 403.","Workday's own docs list https://cb.myworkday.com/cb1 (and cb-eu.myworkday.com/cb1) as the callback for Workday-as-client scenarios (Extend apps calling external OAuth providers); it is not the callback for this flow.","ISU access ignores the end user's own security, so an ISU can expose more data than the individual user should see. Customers' security teams may push back.","Sandbox/developer tenants are not customer tenants: working there proves the flow but gives no access to customer data. A developer tenant expires after 7 days of inactivity.","Workday also offers a separate Extend API gateway/auth (api.<region>.wcp.workday.com/auth); that is for Extend apps and not the customer-tenant OAuth endpoints used here.","Data-centre/region differences (US, EU, etc.) affect hosts; the Developer Site warns that using a gateway for the wrong region returns 401."],"blockers":[{"blocker":"Customer admin cannot or will not register an API client","symptom":"Customer has no admin with the required security permissions, or their security/change process rejects an external OAuth client.","whatToDo":"Provide the customer a one-page admin checklist (grant type, redirect URI, functional areas, non-expiring refresh token, endpoints to send back) and a minimal-scope justification. Offer an ISU with a constrained security group as an alternative.","escalation":"The customer's Workday administrator or their Workday implementation partner."},{"blocker":"Cannot reach customers at scale without a Workday partnership","symptom":"Every customer requires bespoke admin work; no marketplace presence to build trust.","whatToDo":"Apply to the Workday partner programme (Innovation Partner) and evaluate distributing as a Built on Workday app; these processes are gated and criteria are not public.","escalation":"https://workday.com/en-us/company/partners/become-a-partner.html (partner portal linked from that page)"},{"blocker":"Developer tenant not available or waitlisted","symptom":"Cannot create a development tenant, or the Workday blog says to join a waitlist.","whatToDo":"Check developer.workday.com Console > Tenants; if unavailable, join the waitlist or test against a friendly customer's sandbox/IMPL tenant.","escalation":"https://developer.workday.com/about"},{"blocker":"Authorization or token calls fail against the tenant","symptom":"Wrong host, 404 on /authorize or /token, invalid_client, or 403 on API calls.","whatToDo":"Re-copy Authorization Endpoint, Token Endpoint and REST endpoint from the tenant's View API Clients report; confirm tenant name case; confirm the client's functional areas and the user's domain security, then run Activate Pending Security Policy Changes.","escalation":null},{"blocker":"Composio custom auth config cannot express per-tenant authorize/token URLs","symptom":"Auth config form only takes a client ID and secret, not tenant host and name.","whatToDo":"Ask Composio support how Workday tenant host/tenant name are supplied; otherwise create one auth config per tenant or use a refresh-token/ISU-based approach.","escalation":"Composio support / docs at https://docs.composio.dev"}],"agentCanDo":["Draft the exact admin checklist (Register API Client field values, functional areas, redirect URI) to send to each customer's Workday admin.","Explain how to read the View API Clients report and derive authorize, token and REST URLs and the tenant name.","Validate pasted endpoint URLs and tenant name against the observed patterns.","Create the Composio custom auth config once the customer provides credentials (via the developer's Composio access).","Prepare a security justification for requested functional areas and draft partner-programme and customer outreach text."],"youMustDo":["Create the Workday Build account and request a development tenant (personal email, password setup within 72 hours).","Get each customer's Workday administrator to run Register API Client and security configuration in their tenant: the developer cannot do this for them.","Receive and store each customer's Client ID and Client Secret securely (the secret is shown once).","Apply to the Workday partner programme and complete Built on Workday review, Partner Order and legal agreements if going the marketplace route.","Handle any customer security review, contracts and data-processing terms."],"composio":{"redirectUri":"https://backend.composio.dev/api/v3/toolkits/auth/callback","note":"Composio has no managed OAuth app for Workday (confirmed on its toolkit page). The customer admin must enter the Composio callback as the single Redirection URI when running Register API Client. Because client credentials and authorize/token hosts are per tenant, plan one auth config per customer tenant; whether Composio's config can take a tenant host and tenant name is unverified."},"evidence":[{"claim":"Composio-managed OAuth is not available for the Workday toolkit; you must supply your own OAuth2 credentials; page does not list scopes or tenant fields.","status":"verified","source":"https://docs.composio.dev/toolkits/workday","note":null},{"claim":"A Workday tenant administrator runs 'Register API Client' in the tenant with Grant Type Authorization Code Grant, Access Token Type Bearer, a Redirection URI, non-expiring refresh tokens checkbox and functional-area scopes; Client ID and Secret are generated.","status":"verified","source":"https://nango.dev/docs/api-integrations/workday-oauth/how-to-register-your-own-workday-oauth-app","note":"Third-party vendor docs, not Workday's own login-gated docs."},{"claim":"Okta's guide confirms the same registration (Authorization Code Grant, Bearer, non-expiring refresh tokens, functional areas) and that the client secret is permanently hidden after leaving the confirmation screen; the admin also runs Maintain Functional Areas and Activate Pending Security Policy Changes.","status":"verified","source":"https://help.okta.com/OIE/en-us/content/topics/ai-agents/ai-agent-configure-workday.htm","note":null},{"claim":"Authorization endpoint pattern https://<authorization-domain>/<tenant>/authorize and token endpoint pattern https://<token-domain>/ccx/oauth2/<tenant>/token; values come from the View API Clients report; REST base also uses the token domain.","status":"verified","source":"https://nango.dev/docs/api-integrations/workday-oauth/connect","note":"Derived by Nango from example endpoints. Reco's article shows a different token path (/ccx/oauth2/token), so exact shape varies."},{"claim":"REST URL format is https://{host}/ccx/api/v1/{tenant}/{resource}, e.g. host wd2-impl-services1.workday.com; token request uses Basic auth with refresh_token grant.","status":"verified","source":"https://www.reco.ai/hub/workday-rest-api-integration-security","note":null},{"claim":"Authorization, token and REST hosts may differ especially on implementation or sandbox tenants; tenant name is case-sensitive; scope areas vary by Workday version, check each API's 'Secured by' section.","status":"verified","source":"https://docs.runlayer.com/servers/workday","note":"Runlayer uses PKCE as a public client; Workday's confidential-client option (client secret) is what Nango/Okta describe."},{"claim":"Register API Client for Integrations plus 'Manage Refresh Tokens for Integrations' lets an admin bind an ISU and generate a refresh token; ISU needs Session Timeout 0, password-expiry exemption, security group and domain GET permissions.","status":"verified","source":"https://docs.workato.com/connectors/workday.html","note":"Workato says the Register API Client for Integrations task is required only for custom objects in its use case."},{"claim":"Workday allows only one redirect URI per application; Authorization Code and ISU/JWT variants exist.","status":"verified","source":"https://cdn.cdata.com/help/JWN/ado/pg_adoauthcustomappcreate.htm","note":"Single vendor claim; not confirmed on a Workday doc."},{"claim":"Free Workday Build developer account with personal email; development tenant created from Console > Tenants; provisioning described as 1-2 minutes in one doc and about 15 minutes in another.","status":"verified","source":"https://developer.workday.com/doc/GUID-6c547385-848b-4005-ab2c-632f1d6b5688.md","note":"Docs disagree on timing (1-2 min vs ~15 min)."},{"claim":"Personal account development tenant limits: one active tenant, no more than two in 6 hours, expires after 7 consecutive days without login; eligibility is Personal Account developers via the Open Developer Platform programme.","status":"verified","source":"https://developer.workday.com/doc/GUID-4f875963-a845-43b5-868a-0f77e6261eb7-enHYPHENus.md","note":null},{"claim":"Workday announced pilot access to its Open Developer Platform with a waitlist at developer.workday.com/about, dated 27 Aug 2026; developers get their own Workday tenant.","status":"verified","source":"https://blog.workday.com/en-us/workday-open-platform.html","note":"The fetched developer.workday.com/about page did not mention a waitlist, so waitlist status is unclear."},{"claim":"Workday partner programme types: Innovation Partners (Build), Sales Partners (Grow), Services Partners (Deliver); Workday Marketplace has solutions 'built on and certified for' the platform; requirements and process not listed publicly on that page.","status":"verified","source":"https://workday.com/en-us/company/partners/become-a-partner.html","note":null},{"claim":"Built on Workday app distribution: Producer account, developer site access, WCP dev tenant account; submit for review in the Approval Status section, Workday approves, promote to Production, complete Partner Order process; customers install from App Manager.","status":"verified","source":"https://developer.workday.com/doc/GUID-14830fd0-75ea-44a8-990a-ecaed15f494e.md","note":"Approval criteria and Partner Order details not public."},{"claim":"Extend ISU authentication: admin assigns ISU to an app in App Manager, which creates an API client; Company Administrator adds tenant consent when promoting to non-development tenants; ISU access can bypass end-user security.","status":"verified","source":"https://developer.workday.com/doc/GUID-cb3e0fcd-bb97-4005-8d10-3a02e88dab71-enHYPHENus.md","note":"Applies to Extend apps, not to the customer-tenant Register API Client flow."},{"claim":"Workday tenant callback URLs for Workday-as-client scenarios are https://cb.myworkday.com/cb1 and https://cb-eu.myworkday.com/cb1; Extend gateways are api.<region>.wcp.workday.com with /auth for authorization.","status":"verified","source":"https://developer.workday.com/doc/cpx1566499453357.md","note":"Gateway info from https://developer.workday.com/doc/dlh1653340161856.md. Neither is used by the Composio customer-tenant flow."},{"claim":"Each production customer must perform its own registration, so there is one client ID/secret per customer tenant and no global developer-owned OAuth app.","status":"inferred","source":"https://nango.dev/docs/api-integrations/workday-oauth/how-to-register-your-own-workday-oauth-app","note":"Inferred from the Register API Client task being run inside the tenant by its admin; no Workday doc read that states this outright."},{"claim":"Lead time per customer is days to weeks, driven by the customer's admin availability and change/security review.","status":"inferred","source":null,"note":"No source gives timings; this is an estimate."},{"claim":"Composio needs one auth config per customer tenant, and may not be able to template tenant host/name in authorize/token URLs.","status":"unverified","source":null,"note":"Composio's toolkit page does not describe tenant fields; confirm with Composio."},{"claim":"Exact security domains and Workday-side permissions an admin needs to run Register API Client, and the official Workday doc for it.","status":"unverified","source":null,"note":"doc.workday.com and Workday Community docs are login-gated and were not read."}],"uncertainties":["UNVERIFIED: Official Workday documentation for the 'Register API Client' and 'Register API Client for Integrations' tasks (doc.workday.com / Community) is login-gated and was not read; field names and steps come from third-party vendor docs (Nango, Okta, Workato, CData, Unified.to, Reco, Runlayer).","UNVERIFIED: Whether Composio's custom auth config for WORKDAY can accept a per-tenant authorize/token host and tenant name, or requires one config per tenant.","UNVERIFIED: Partner programme and Marketplace listing requirements, fees, security review criteria and timelines; Workday's public pages do not list them.","UNVERIFIED: Whether the Open Developer Platform is open sign-up or waitlist-gated today; the Workday blog post says waitlist, the developer docs describe self-serve tenant creation.","UNVERIFIED: Exact difference between 'API Client' (interactive authorization code) and 'API Client for Integrations' (ISU, refresh-token based) beyond what vendor docs show; the vendors' descriptions are partial.","UNVERIFIED: The exact token endpoint path (/ccx/oauth2/<tenant>/token vs /ccx/oauth2/token), which differs between sources; use the customer's View API Clients report.","UNVERIFIED: Whether a developer sandbox tenant (WCP development tenant) exposes the same Register API Client task and tenant endpoints as a customer IMPL/SANDBOX tenant.","Typical per-customer lead times are an estimate; no source states them."],"lastChecked":"2026-10-20"},{"slug":"xero","name":"Xero","composioSlug":"XERO","website":"https://developer.xero.com","summary":"Self-serve: create a Web app in the Xero developer portal in minutes, but since 2 March 2026 a free Starter app is capped at 5 connected organisations, 50 needs a paid Core plan (card on file), and more than 50 requires App Partner certification.","difficulty":3,"difficultyWhy":"Credentials are instant and free, but real multi-user rollout hits a hard connection cap: 5 free, 50 on Core (AUD 35/month), and 1,000+ only after App Certification (10 active non-demo beta customers plus technical checkpoints). Granular scopes introduced in 2026 add migration work.","time":{"setup":"~15 min","approval":"none for up to 5 connections (Starter) or 50 (Core, card required); App Certification for >50 connections: timeline not published (likely weeks, unverified)","total":"same day for testing / up to 50 orgs; weeks to months for certification"},"gatingModel":"self-serve-with-limits","devModeLimits":"New apps default to the Starter plan: unlimited data access but max 5 connections (authorised Xero organisations), 1,000 API calls per day per organisation, and no App Store listing. Adding a 6th connection requires entering payment details, which moves the app to Core (max 50 connections, 5,000 calls/day/org, AUD 35/month). Demo Company can be used for testing but does not count as a beta customer for certification. Apps created on or after 2 March 2026 can only use granular scopes.","stages":[{"name":"Sign up for Xero account and open developer portal","duration":"5 min","owner":"you"},{"name":"Create Web app (auth code flow), set redirect URI, generate client secret","duration":"10 min","owner":"you"},{"name":"Create Composio custom auth config with client ID/secret and scopes","duration":"5 min","owner":"agent"},{"name":"Add payment card to move from Starter (5) to Core (50 connections), if needed","duration":"5 min","owner":"you"},{"name":"Onboard 10 active non-demo customer connections, complete certification checkpoints and submit (only if >50 connections needed)","duration":"weeks to months","owner":"provider"}],"steps":[{"n":1,"title":"Sign in to the Xero developer portal","detail":"Go to developer.xero.com and sign in with a Xero account (create a free Xero login at xero.com if you have none; community guide says a Xero trial is only needed to add the app but you do not have to use it).","owner":"you","url":"https://developer.xero.com"},{"n":2,"title":"Create a new app","detail":"Open My Apps and choose New app. Fields: App name (shown to users when they connect), Integration type = Web app (standard authorization code flow with client secret), Company or application URL, Redirect URI. Other integration types exist: PKCE (native/SPA, no secret) and Custom Connection (machine-to-machine for a single org, premium, AU/NZ/UK/US orgs only), but for Composio use Web app.","owner":"you","url":"https://developer.xero.com/app/manage"},{"n":3,"title":"Set redirect URI to Composio's callback","detail":"Add https://backend.composio.dev/api/v3/toolkits/auth/callback as a redirect URI. Xero requires an absolute URI, does not allow wildcards, and allows up to 50 redirect URIs per app.","owner":"you","url":"https://developer.xero.com/faq/oauth2"},{"n":4,"title":"Generate the client secret","detail":"In the app's Configuration page under OAuth 2.0 credentials, copy the Client ID and click Generate a secret. The secret is displayed once; store it securely.","owner":"you","url":"https://developer.xero.com/app/manage"},{"n":5,"title":"Choose scopes","detail":"Always include offline_access (otherwise no refresh token) and openid/profile/email if needed. Apps created on or after 2 March 2026 must use granular accounting scopes (e.g. accounting.invoices, accounting.payments, accounting.banktransactions, accounting.manualjournals, accounting.contacts, accounting.settings, accounting.reports.profitandloss.read, accounting.reports.balancesheet.read, each with a .read variant for read-only). Older apps may still use accounting.transactions and accounting.reports.read until the 13 September 2027 deadline. Verify exact scope strings in the Xero scopes docs before configuring.","owner":"you","url":"https://devblog.xero.com/upcoming-changes-to-xero-accounting-api-scopes-705c5a9621a0"},{"n":6,"title":"Create the Composio custom auth config","detail":"In Composio, create a custom auth config for the XERO toolkit using the Xero Client ID, Client Secret and the chosen scopes; then connect a Xero test user.","owner":"agent","url":null},{"n":7,"title":"Test with Demo Company, then a real org","detail":"During the consent flow the user picks which Xero organisation(s) to authorise; every authorised org counts as a connection toward your plan cap. Xero provides a Demo Company for testing (resets periodically; not valid for certification beta-customer counts). After connecting, list tenants via the connections endpoint and send xero-tenant-id on API calls.","owner":"you","url":"https://developer.xero.com/documentation/guides/oauth2/tenants/"},{"n":8,"title":"Monitor connection count and upgrade plan","detail":"Connection counts and egress metering appear in the developer dashboard (My Apps). To exceed 5 connections add a credit card (moves to Core, up to 50). For Plus (1,000 connections, AUD 245/month) App Certification is a prerequisite; Advanced (10,000) also requires an initial and annual security assessment.","owner":"you","url":"https://developer.xero.com/pricing"},{"n":9,"title":"Apply for App Certification (only if scaling beyond 50 connections)","detail":"Onboard at least 10 beta customers (not demo companies, with API calls made to their tenant in the last 30 days; raised from 3 to 10 in 2025), then submit the certification application. Checkpoints cover Connection, Branding and Naming, App Launcher, Scopes, Error handling, Data Integrity, Account and Payment mapping, Taxes. App Store listing is optional on Plus/Advanced and required on Enterprise.","owner":"you","url":"https://developer.xero.com/documentation/xero-app-store/app-partner-guides/certification-checkpoints"}],"requirements":["A Xero user login (free) to access developer.xero.com and create apps","Starter: no fee, max 5 connections. Core: AUD 35/month (tax excl.), 10 GB egress included, AUD 2.40/GB overage, credit card required, max 50 connections","Plus (AUD 245/month, max 1,000), Advanced (AUD 1,445/month, max 10,000): App Certification required; Advanced also requires security assessment (initial and annual)","Enterprise (unlimited connections): price on application, certification, security assessment and App Store listing required","Certification application requires 10 active, non-demo beta customer connections (as of May 2025 announcement)","App Partner programme (App Store partner) requirements per Xero PDF: be listed on the App Store, meet technical and security standards, reach 10k MRR growth via App Store, minimum 50 reviews with 4-star average, connected to App Launcher","Privacy policy and terms URLs are part of app details (per community guide)","Xero terms prohibit using API data to train AI/ML models; violations can lead to key revocation (reported by third-party blog)"],"gotchas":["The old 'uncertified apps limited to 25 tenants' rule is superseded: Xero's current pricing page shows Starter capped at 5 connections and does not describe a separate uncertified rule. Do not assume 25.","Connection counts and egress are measured per app, not per developer; apps cannot share them. A separate custom auth config per Composio project with the same Xero app shares one count.","Connections are per Xero organisation, not per user: one user authorising 3 orgs uses 3 connections. Disconnected/inactive connections should be cleaned up to free capacity (Xero has a connection cleanup best-practice guide).","Access tokens expire after 30 minutes. Refresh tokens are single-use and rotate: store the new refresh token returned on each refresh. Unused refresh tokens expire after 60 days; a 30-minute grace period lets you retry the previous refresh token.","offline_access scope is required to receive refresh tokens (standard Xero behaviour; not re-confirmed on a docs page this session).","Granular scopes: apps created on or after 2 March 2026 get only granular scopes; accounting.transactions and accounting.reports.read are split into new scopes. Existing apps get granular scopes by end of April 2026 and must finish migrating by 13 September 2027.","Redirect URIs must be absolute, no wildcards, max 50.","Rate limits: 5 concurrent calls, 60 calls per minute per org, 1,000 calls/day/org on Starter or 5,000/day/org on Core and above, 10,000 calls/minute per app.","Custom Connection (machine-to-machine) apps are a premium option only for orgs in AU, NZ, UK and US, tied to a single org; not suitable for multi-tenant agent products.","Pricing is in AUD, billed by card on the 1st of the following month; the Starter to Core move happens when you add payment details to go beyond 5 connections.","Journals endpoint, Xero Practice Manager API and Bulk Connections are only on Advanced and above and need security assessment and use-case approval.","Xero retired the 15% App Store revenue-share (XASS/commercial billing) model; XASS customers had to be moved by 1 July 2026."],"blockers":[{"blocker":"Hit the 5-connect const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = (s) => String(s || "").toLowerCase().replace(/^https?:\/\//, "").replace(/^www\./, "").replace(/\.(com|io|co|dev|ai|app|net|org)(\/.*)?$/, "").replace(/[^a-z0-9]/g, "");
const safeUrl = (u) => (typeof u === "string" && /^https:\/\/[^\s"'<>]+$/i.test(u) ? u : null);
const link = (u, label) => { const s = safeUrl(u); return s ? `<a href="${esc(s)}" target="_blank" rel="noopener noreferrer">${esc(label || s)}</a>` : ""; };
const arr = (x) => (Array.isArray(x) ? x : x == null || x === "" ? [] : [x]);
const str = (x, d = "") => (x == null ? d : typeof x === "string" ? x : typeof x === "number" ? String(x) : d);

const MANAGED = new Set(DIRECTORY.managed.map(norm));
const BYO = new Set(DIRECTORY.byo.map(norm));
const ALIASES = { x: "twitter", twitterx: "twitter", xtwitter: "twitter", facebookads: "metaads", facebookmarketing: "metaads", metamarketing: "metaads", instagramads: "metaads", gsheets: "googlesheets", gdrive: "googledrive", gcal: "googlecalendar", office365: "outlook", ms365: "outlook" };
const BYNORM = new Map(GUIDES.map((g) => [norm(g.composioSlug), g]));

function directoryStatus(name) {
  let n = norm(name);
  if (ALIASES[n]) n = ALIASES[n];
  if (BYO.has(n)) return { status: "byo", slug: DIRECTORY.byo.find((s) => norm(s) === n) };
  if (MANAGED.has(n)) return { status: "managed", slug: DIRECTORY.managed.find((s) => norm(s) === n) };
  return { status: "none", slug: null };
}
function similar(name, limit = 8) {
  const n = norm(ALIASES[norm(name)] || name);
  if (!n) return [];
  const all = [...DIRECTORY.byo.map((s) => ({ s, status: "byo" })), ...DIRECTORY.managed.map((s) => ({ s, status: "managed" }))];
  const hit = all.filter((x) => norm(x.s).startsWith(n)).concat(all.filter((x) => !norm(x.s).startsWith(n) && norm(x.s).includes(n)));
  return hit.slice(0, limit);
}

        <div><b>Some gates are money or people</b><span>Xero's free plan caps an app at 5 connections and the next tier is a paid plan with a card. Workday has no developer-owned app at all: each customer's admin registers a client in their own tenant.</span></div>

  try { history.replaceState(null, "", location.pathname + location.search); } catch (_) {}
}

function short(s) { s = str(s); const cut = s.split(/ \(|; | \| /)[0]; return cut.length > 70 ? cut.slice(0, 68) + "…" : cut; }

function renderGuide(g, isGen) {

  const evid = ev.map((e) => `<div class="ev"><div><span class="chip ${e.status === "verified" ? "ok" : e.status === "inferred" ? "warn" : "bad"}">${esc(e.status)}</span> ${esc(e.claim)}</div>${safeUrl(e.source) ? `<div class="src">${link(e.source)}${isGen ? ' <span class="muted">(model-suggested, not opened)</span>' : ""}</div>` : '<div class="src muted">No source opened</div>'}${e.note ? `<div class="nt">${esc(e.note)}</div>` : ""}</div>`).join("");
  const li = (a) => arr(a).map((x) => `<li>${esc(x)}</li>`).join("");

  $("#main").innerHTML = `
    <article class="panel" id="guide">

        <h2>${esc(g.name)}</h2>
        <p class="lede">${esc(g.summary)}</p>
      </div>
      ${isGen ? `<div class="banner"><b>Draft from model knowledge.</b><span>The model could not open any web page while writing this. Treat every figure, date and limit as a lead to confirm on the official pages, not as fact. Review notes from its own second pass are listed under Uncertainties.</span></div>` : ""}
      <div class="metrics">

      <div class="split">

      <div class="callout"><b>Composio custom auth config</b><span>Use <span class="mono">${esc(g.composio.redirectUri)}</span> as the redirect URI. ${esc(g.composio.note)}</span></div>

function toMarkdown(g, isGen) {
  const L = (a) => arr(a).map((x) => `- ${x}`).join("\n");
  return `# ${g.name}: OAuth app guide\n${isGen ? "\n> AI draft from model knowledge. Unverified: confirm every claim on the official pages.\n" : `\n_Checked ${g.lastChecked}_\n`}\n${g.summary}\n\n**Difficulty:** ${g.difficulty}/5 (${DIFF_LABEL[g.difficulty]}). ${g.difficultyWhy}\n\n| Setup | Approval | Total |\n|---|---|---|\n| ${g.time.setup} | ${g.time.approval} | ${g.time.total} |\n\n${g.devModeLimits ? `**Before approval:** ${g.devModeLimits}\n\n` : ""}## Path\n${arr(g.stages).map((s, i) => `${i + 1}. ${s.name} (${OWNER[s.owner] || s.owner}, ${s.duration})`).join("\n")}\n\n## An agent can do\n${L(g.agentCanDo)}\n\n## You have to do\n${L(g.youMustDo)}\n\n## Steps\n${arr(g.steps).map((s) => `${s.n}. **${s.title}** (${OWNER[s.owner] || "You"}). ${s.detail}${s.url ? ` ${s.url}` : ""}`).join("\n")}\n\nComposio redirect URI: ${g.composio.redirectUri}. ${g.composio.note}\n\n## Requirements\n${L(g.requirements)}\n\n## Gotchas\n${L(g.gotchas)}\n\n## If you hit a blocker\n${arr(g.blockers).map((b) => `- **${b.blocker}.** ${b.symptom} ${b.whatToDo}${b.escalation ? ` Escalate: ${b.escalation}` : ""}`).join("\n")}\n\n## Evidence\n${arr(g.evidence).map((e) => `- [${e.status}] ${e.claim}${e.source ? ` (${e.source})` : ""}`).join("\n")}\n\n## Uncertainties\n${L(g.uncertainties)}\n`;
}
async function copyMd(g, isGen) {
  const text = toMarkdown(g, isGen), note = $("#cp-note");
  try { await navigator.clipboard.writeText(text); note.textContent = "Copied"; }
  catch (e) {
    const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;opacity:0"; document.body.append(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (_) {} ta.remove(); note.textContent = ok ? "Copied" : "Copy blocked: select the page text instead";
  }
  setTimeout(() => { if (note) note.textContent = ""; }, 3000);
}

function openGuide(slug) {
  const g = GUIDES.find((x) => x.slug === slug);
  if (!g) return renderOverview();
  generated = null; current = slug; renderRail(); renderGuide(g, false);
  try { history.replaceState(null, "", "#" + slug); } catch (_) {}
}

/* ---------- lookup ---------- */
function suggestions() {
  const q = $("#q").value.trim(), box = $("#sugg");
  if (!q) { box.hidden = true; box.innerHTML = ""; return; }
  const n = norm(q), items = [];
  const lib = GUIDES.filter((g) => norm(g.name).includes(n) || norm(g.composioSlug).includes(n) || norm(ALIASES[n] || "") === norm(g.composioSlug));
  lib.forEach((g) => items.push({ kind: "open", slug: g.slug, label: g.name, tag: statusChip("byo") + ' <span class="chip acc">Guide ready</span>', act: "Open guide" }));
  similar(q, 6).filter((x) => !BYNORM.has(norm(x.s))).forEach((x) => items.push({ kind: "gen", name: pretty(x.s), label: pretty(x.s), tag: statusChip(x.status), act: "Generate guide" }));
  items.push({ kind: "gen", name: q, label: `“${q}”`, tag: statusChip(directoryStatus(q).status), act: "Generate guide" });
  box.innerHTML = items.map((it, i) => `<li><button type="button" data-i="${i}"><span><span class="nm">${esc(it.label)}</span> ${it.tag}</span><span class="act">${it.act}</span></button></li>`).join("");
  box.hidden = false;
  box._items = items;
}
function pick(it) {
  $("#sugg").hidden = true;
  if (it.kind === "open") { $("#q").value = ""; openGuide(it.slug); } else { generate(it.name); }
}
function submitQuery() {
  const q = $("#q").value.trim(); if (!q) return;
  const n = norm(ALIASES[norm(q)] || q), g = GUIDES.find((x) => norm(x.name) === n || norm(x.composioSlug) === n);
  if (g) { $("#q").value = ""; $("#sugg").hidden = true; openGuide(g.slug); } else { $("#sugg").hidden = true; generate(q); }
}
